n      tracks.forEach(function (track) { track.pause(); track.currentTime = 0; });\n      idle();\n    }\n    function startTrack() {\n      var ticket = attempt;\n      var track = tracks[trackIndex];\n      if (!track) { idle(); return; }\n      playing = true;\n      played = true;\n      audioPanel.classList.add('is-playing');\n      play.setAttribute('aria-pressed', 'true');\n      playLabel.textContent = 'Dừng âm thanh';\n      audioStatus.textContent = '';\n      function failed() {\n        if (ticket !== attempt) return;\n        idle();\n        audioStatus.textContent = 'Chưa phát được âm thanh. Nhấn nghe để thử lại.';\n      }\n      try { Promise.resolve(track.play()).catch(failed); } catch (error) { failed(); }\n    }\n    tracks.forEach(function (track, index) {\n      track.preload = 'none';\n      track.removeAttribute('autoplay');\n      track.addEventListener('ended', function () {\n        if (!playing || index !== trackIndex) return;\n        if (trackIndex \u003c tracks.length - 1) { trackIndex += 1; startTrack(); }\n        else idle();\n      });\n      track.addEventListener('error', function () {\n        if (!playing || index !== trackIndex) return;\n        stop();\n        audioStatus.textContent = 'Chưa tải được âm thanh. Nhấn nghe để thử lại.';\n      });\n    });\n    play.addEventListener('click', function () {\n      if (playing) { stop(); return; }\n      attempt += 1;\n      trackIndex = 0;\n      tracks.forEach(function (track) { track.currentTime = 0; });\n      startTrack();\n    });\n    if (!tracks.length) audioPanel.hidden = true;\n  }\n  if (!answers.length) {\n    form.hidden = true;\n    guide.hidden = true;\n    find('.ft-empty').hidden = false;\n  }\n  drawGuide();\n})();\n\u003c/script>\n", "back": "\u003cstyle>:root {\n  color-scheme: light;\n  --ft-bg: #fffdfa;\n  --ft-surface: #ffffff;\n  --ft-ink: oklch(0.19 0.02 50);\n  --ft-muted: oklch(0.5 0.025 45);\n  --ft-border: oklch(0.9 0.025 60);\n  --ft-soft: oklch(0.96 var frame = document.getElementById('demo');
var tabs = document.querySelector('.tabs');
var answer = document.getElementById('sample-answer');
var selected = cases[0];
var side = 'front';
function draw() {
  var item = selected;
  tabs.querySelectorAll('button').forEach(function (button) { button.setAttribute('aria-pressed', String(button.dataset.case === item.id)); });
  document.querySelectorAll('[data-side]').forEach(function (button) { button.setAttribute('aria-pressed', String(button.dataset.side === side)); });
  answer.textContent = item.values.Answer.join(' / ');
  frame.title = side === 'front' ? 'Mặt trước luyện gõ' : 'Mặt sau ôn lại nội dung';
  frame.srcdoc = '<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body class="card">' + item[side] +
    '<script>new ResizeObserver(function(){parent.postMessage({type:"flama-preview-height",height:document.body.scrollHeight},"*")}).observe(document.body);<\/script></body></html>';
}
function choose(item) { selected = item; side = 'front'; draw(); }
document.querySelectorAll('[data-side]').forEach(function (button) {
  button.addEventListener('click', function () { side = button.dataset.side; draw(); });
});
cases.forEach(function (item) {
  var button = document.createElement('button');
  button.type = 'button';
  button.dataset.case = item.id;
  button.textContent = item.name;
  button.setAttribute('aria-pressed', 'false');

  tabs.append(button);

  if (event.source !== frame.contentWindow || event.data.type !== 'flama-preview-height') return;
