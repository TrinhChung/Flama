<div class="ft-card" data-mode="meaning">
  <div class="ft-mode"><span class="ft-mode-icon"><svg class="ft-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M7 9h.01M11 9h.01M15 9h.01M18 9h.01M7 12h.01M11 12h.01M15 12h.01M7 15h10"></path></svg></span><span>Gõ nghĩa</span></div>
  <div class="ft-stimulus">
    {{#PromptText}}<div class="ft-prompt-text">{{PromptText}}</div>{{/PromptText}}
    <p class="ft-instruction">Nhập một nghĩa của từ này.</p>
  </div>
  {{#DefinitionHint}}<div class="ft-definition-hint">
    <button class="ft-definition-toggle" type="button" aria-expanded="false" aria-controls="ft-definition-content"><span class="ft-definition-label"><svg class="ft-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6m-5 3h4M8 14a6 6 0 1 1 8 0c-1 1-1 2-1 2H9s0-1-1-2Z"></path></svg><span>Giải thích bằng ngôn ngữ đích</span></span><svg class="ft-icon ft-definition-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
    <div class="ft-definition-content" id="ft-definition-content" hidden>{{{DefinitionHint}}}</div>
  </div>{{/DefinitionHint}}
  <div class="ft-entry">
    <label class="ft-label" for="ft-input">Nghĩa của từ</label>
    <div class="ft-input-wrap"><input class="ft-input" id="ft-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    <span class="ft-entry-help" id="ft-entry-help">Chỉ cần một nghĩa đúng · Enter để kiểm tra.</span>
    <div class="ft-character-hint" id="ft-character-hint" hidden role="note"><span class="ft-character-label">Gợi ý một nghĩa</span><span class="ft-character-prefix" aria-live="polite"></span></div>
    <div class="ft-actions">
      <button class="ft-button ft-hint" type="button"><svg class="ft-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6m-5 3h4M8 14a6 6 0 1 1 8 0c-1 1-1 2-1 2H9s0-1-1-2Z"></path></svg><span>Mở ký tự</span></button>
      <button class="ft-button ft-check" type="button"><span>Kiểm tra</span><svg class="ft-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg></button>
    </div>
    <div class="ft-status" id="ft-status" role="status" aria-live="polite"></div>
  </div>
  <div class="ft-empty" hidden>Chưa có đáp án cho thẻ này.</div>
  <div class="ft-answer-source" hidden>{{Answer}}</div>
</div>
<script>
(function () {
  'use strict';
  var root = document.querySelector('.ft-card');
  if (!root) return;
  var find = function (selector) { return root.querySelector(selector); };
  var input = find('.ft-input');
  var form = find('.ft-entry');
  var status = find('.ft-status');
  var characterHint = find('.ft-character-hint');
  var prefix = find('.ft-character-prefix');
  var hint = find('.ft-hint');
  var checkButton = find('.ft-check');
  var composing = false;
  var revealed = 0;
  var solved = false;

  function normalize(text) {
    return String(text || '').normalize('NFC').replace(/[\s\u3000]+/g, ' ').trim();
  }
  function comparable(text) { return normalize(text).toLowerCase(); }
  // Each rendered <br> is an existing array boundary; punctuation stays in the item.
  function readArray(element) {
    if (!element) return [];
    var values = [''];
    element.childNodes.forEach(function (node) {
      if (node.nodeName === 'BR') values.push('');
      else values[values.length - 1] += node.textContent || '';
    });
    return values.map(normalize).filter(Boolean);
  }
  function characters(text) {
    if (typeof Intl !== 'undefined' && Intl.Segmenter) {
      return Array.from(new Intl.Segmenter(undefined, { granularity: 'grapheme' }).segment(text), function (part) {
        return part.segment;
      });
    }
    return Array.from(text.normalize('NFC'));
  }
  var answers = readArray(find('.ft-answer-source'));
  var first = characters(answers[0] || '');
  // Hints use one meaning; the input never implies a shared length for all meanings.
  var hintLimit = Math.min(48, Math.max(first.filter(function (ch) { return !/\s/.test(ch); }).length - 1, 0));
  if (!input) {
    input = document.createElement('input');
    input.className = 'ft-input';
    input.id = 'ft-input';
    input.type = 'text';
    find('.ft-input-wrap').prepend(input);
  }
  input.placeholder = 'Gõ một nghĩa bạn nhớ…';
  input.autocomplete = 'off';
  input.spellcheck = false;
  input.setAttribute('autocapitalize', 'off');
  input.setAttribute('aria-describedby', 'ft-status ft-entry-help ft-character-hint');
  input.setAttribute('aria-keyshortcuts', 'Enter');
  checkButton.disabled = true;

  function drawHint() {
    hint.disabled = solved || revealed >= hintLimit;
    characterHint.hidden = solved || !revealed || !answers.length;
    var text = '';
    var seen = 0;
    for (var i = 0; i < first.length; i++) {
      if (!/\s/.test(first[i])) {
        if (seen >= revealed) break;
        seen += 1;
      }
      text += first[i];
    }
    prefix.textContent = revealed ? normalize(text) + '…' : '';
  }
  function setStatus(kind, message) {
    form.classList.remove('is-correct', 'is-incorrect');
    if (kind) form.classList.add('is-' + kind);
    status.className = 'ft-status' + (kind ? ' is-' + kind : '');
    status.textContent = message;
    input.setAttribute('aria-invalid', kind === 'incorrect' ? 'true' : 'false');
  }
  function check() {
    if (composing) return;
    var typed = comparable(input.value);
    if (!typed) { input.focus(); return; }
    var matched = answers.find(function (answer) { return comparable(answer) === typed; });
    solved = matched !== undefined;
    setStatus(solved ? 'correct' : 'incorrect', solved
      ? 'Chính xác! Bạn đã gõ đúng một nghĩa.'
      : 'Chưa đúng. Thử lại hoặc mở thêm gợi ý nhé.');
    drawHint();
    if (!solved) input.focus();
  }
  input.addEventListener('compositionstart', function () { composing = true; });
  input.addEventListener('compositionend', function () {
    composing = false;
    checkButton.disabled = !comparable(input.value);
  });
  input.addEventListener('input', function () {
    solved = false;
    setStatus('', '');
    checkButton.disabled = !comparable(input.value);
    drawHint();
  });
  input.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' || event.isComposing || composing || event.keyCode === 229) return;
    event.preventDefault();
    check();
  });
  checkButton.addEventListener('click', check);
  hint.addEventListener('click', function () {
    revealed = Math.min(hintLimit, revealed + 1);
    drawHint();
    input.focus();
  });
  // DefinitionHint is an optional learner-controlled clue, independent of Answer.
  var definitionHint = find('.ft-definition-hint');
  if (definitionHint) {
    var definitionContent = find('.ft-definition-content');
    var definitionToggle = find('.ft-definition-toggle');
    if (!normalize(definitionContent.textContent) && !definitionContent.querySelector('img, audio, video')) {
      definitionHint.hidden = true;
    } else {
      definitionToggle.addEventListener('click', function () {
        var opening = definitionContent.hidden;
        definitionContent.hidden = !opening;
        definitionToggle.setAttribute('aria-expanded', String(opening));
        definitionHint.classList.toggle('is-open', opening);
      });
    }
  }
  var text = find('.ft-prompt-text');
  if (text && !text.textContent.trim()) text.hidden = true;
  if (!answers.length) {
    form.hidden = true;
    find('.ft-empty').hidden = false;
  }
  drawHint();
})();
</script>
