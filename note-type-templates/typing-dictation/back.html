<div class="ft-card ft-back" data-mode="dictation">
  <div class="ft-back-hero">
    <div class="ft-back-meta">
    </div>
  </div>
  {{#Answer}}<div class="ft-answer-panel"><div class="ft-answer-label">Bản chép</div><div class="ft-answer-values">{{Answer}}</div></div>{{/Answer}}
  <div class="ft-back-content">
    {{#Translation}}<div class="ft-info-block ft-info-definition" data-info="Translation"><h2 class="ft-info-heading">Bản dịch</h2><div class="ft-info-content">{{{Translation}}}</div></div>{{/Translation}}
    {{#Notes}}<div class="ft-info-block" data-info="Notes"><h2 class="ft-info-heading">Ghi chú</h2><div class="ft-info-content">{{{Notes}}}</div></div>{{/Notes}}
    {{#Audio}}<div class="ft-info-block ft-info-audio" data-info="Audio"><h2 class="ft-info-heading">Nghe lại</h2><div class="ft-info-content">{{{Audio}}}</div></div>{{/Audio}}
    {{#BackImage}}<div class="ft-info-block ft-info-media" data-info="BackImage"><h2 class="ft-info-heading">Hình minh họa</h2><div class="ft-info-content">{{{BackImage}}}</div></div>{{/BackImage}}
  </div>
</div>
<script>
(function () {
  'use strict';
  var root = document.querySelector('.ft-back');
  if (!root) return;

  // Read the rendered array boundaries without re-parsing migrated delimiters.
  function readArray(source) {
    var values = [''];
    source.childNodes.forEach(function (node) {
      if (node.nodeName === 'BR') values.push('');
      else values[values.length - 1] += node.textContent || '';
    });
    return values.map(function (value) { return value.trim(); }).filter(Boolean);
  }

  root.querySelectorAll('.ft-answer-values').forEach(function (source) {
    var values = readArray(source);
    if (!values.length) { source.closest('.ft-answer-panel').hidden = true; return; }
    var primary = document.createElement('div');
    primary.className = 'ft-answer-primary';
    primary.textContent = values[0];
    source.replaceChildren(primary);
    if (values.length > 1) {
      var variants = document.createElement('div');
      variants.className = 'ft-answer-variants';
      values.slice(1).forEach(function (value) {
        var item = document.createElement('span');
        item.textContent = value;
        variants.append(item);
      });
      source.append(variants);
    }
  });

  root.querySelectorAll('.ft-info-array').forEach(function (source) {
    var values = readArray(source);
    if (!values.length) { source.closest('.ft-info-block').hidden = true; return; }
    var list = document.createElement('ul');
    list.className = 'ft-info-list';
    values.forEach(function (value) {
      var item = document.createElement('li');
      item.textContent = value;
      list.append(item);
    });
    source.replaceChildren(list);
  });
  root.querySelectorAll('.ft-info-block, .ft-back-meta-item').forEach(function (block) {
    var content = block.querySelector('.ft-info-content, .ft-info-array') || block;
    if (!content.textContent.trim() && !content.querySelector('audio, img, video')) block.hidden = true;
  });
  root.querySelectorAll('.ft-example-group, .ft-back-content').forEach(function (group) {
    if (!group.querySelector('.ft-info-block:not([hidden])')) group.hidden = true;
  });
  var hero = root.querySelector('.ft-back-hero');
  if (hero && !hero.textContent.trim()) hero.hidden = true;
  root.querySelectorAll('audio').forEach(function (audio) {
    audio.removeAttribute('autoplay');
    audio.preload = 'none';
  });
})();
</script>
