<div class="ft-card" data-mode="dictation">
  <div class="ft-mode"><span class="ft-mode-icon"><svg class="ft-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="M7 9h.01M11 9h.01M15 9h.01M18 9h.01M7 12h.01M11 12h.01M15 12h.01M7 15h10"></path></svg></span><span>Gõ chép chính tả</span></div>
  <div class="ft-stimulus">
    {{#Audio}}
    <div class="ft-audio">
      <div class="ft-audio-source" hidden>{{{Audio}}}</div>
      <div class="ft-audio-row">
        <button class="ft-play" type="button" aria-pressed="false">
          <span class="ft-play-disc" aria-hidden="true"></span>
          <span><span class="ft-play-label">Nghe âm thanh</span><span class="ft-audio-subtitle">Nhấn để nghe, có thể phát lại</span></span>
        </button>
        <div class="ft-wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="ft-audio-status" role="status" aria-live="polite"></div>
    </div>
    {{/Audio}}
    <p class="ft-instruction">Nghe và gõ từng từ trong đoạn.</p>
  </div>
  <div class="ft-guide ft-dict-guide">
    <div class="ft-guide-heading"><span class="ft-guide-label">Đoạn chép chính tả</span><span class="ft-dict-progress"></span></div>
    <div class="ft-dict-passage" role="group" aria-label="Đoạn chép chính tả. Bấm vào một từ để gõ lại."></div>
    <p class="ft-dict-help">Bấm vào từ màu đỏ để sửa. Dấu câu đã có sẵn.</p>
  </div>
  <div class="ft-entry ft-dict-entry">
    <label class="ft-label" for="ft-input">Từ đang gõ <span class="ft-dict-position"></span></label>
    <div class="ft-dict-input-row">
      <div class="ft-input-wrap"><input class="ft-input" id="ft-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <button class="ft-button ft-check" type="button">Chốt từ</button>
    </div>
    <span class="ft-entry-help" id="ft-entry-help">Dấu cách hoặc Enter để chốt từ và tiếp tục.</span>
    <div class="ft-actions">
      <button class="ft-button ft-hint" type="button"><svg class="ft-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6m-5 3h4M8 14a6 6 0 1 1 8 0c-1 1-1 2-1 2H9s0-1-1-2Z"></path></svg><span>Mở ký tự</span></button>
      <button class="ft-button ft-dict-remove" type="button" hidden>Xóa từ thừa</button>
      <button class="ft-button ft-dict-reset" type="button">Làm lại</button>
    </div>
    <div class="ft-status" id="ft-status" role="status" aria-live="polite"></div>
  </div>
  <div class="ft-empty" hidden>Chưa có đáp án cho thẻ này.</div>
  <div class="ft-answer-source" hidden>{{Answer}}</div>
</div>
<script>
(function () {
  'use strict';
  var root = document.querySelector('.ft-card');
  if (!root) return;
  var find = function (selector) { return root.querySelector(selector); };
  var input = find('.ft-input');
  var form = find('.ft-entry');
  var guide = find('.ft-guide');
  var passage = find('.ft-dict-passage');
  var progress = find('.ft-dict-progress');
  var position = find('.ft-dict-position');
  var status = find('.ft-status');
  var hint = find('.ft-hint');
  var checkButton = find('.ft-check');
  var removeButton = find('.ft-dict-remove');
  var resetButton = find('.ft-dict-reset');
  var composing = false;
  var active = 0;
  var selected = 0;
  var records = [];
  var wordNodes = [];
  var renderedSeparator = null;

  function normalize(text) {
    return String(text || '').normalize('NFC').replace(/[\s\u3000]+/g, ' ').trim();
  }
  function comparable(text) { return normalize(text).toLowerCase(); }
  // Answer items already arrive separated by <br>; do not re-parse migrated delimiters.
  function readArray(element) {
    var values = [''];
    if (!element) return [];
    element.childNodes.forEach(function (node) {
      if (node.nodeName === 'BR') values.push('');
      else values[values.length - 1] += node.textContent || '';
    });
    return values.map(normalize).filter(Boolean);
  }
  var segmenter = typeof Intl !== 'undefined' && Intl.Segmenter
    ? new Intl.Segmenter(undefined, { granularity: 'grapheme' }) : null;
  function characters(text) {
    return segmenter ? Array.from(segmenter.segment(text), function (part) { return part.segment; })
      : Array.from(text.normalize('NFC'));
  }
  function makeWord(text) {
    var match = /^([^\p{L}\p{N}\p{M}]*)(.*?)([^\p{L}\p{N}\p{M}]*)$/u.exec(text);
    var core = match ? match[2] : text;
    return { prefix: match ? match[1] : '', core: core, suffix: match ? match[3] : '',
      key: comparable(core), chars: characters(core) };
  }
  function transcript(text) {
    text = normalize(text);
    var units = [];
    var prefix = '';
    var spaced = /\s/.test(text);
    var parts = text.match(/\S+/g) || [];
    // No-space Japanese/Chinese text can still be practiced in word-sized units.
    if (!spaced && /[\u3040-\u30ff\u3400-\u9fff]/.test(text) && typeof Intl !== 'undefined' && Intl.Segmenter) {
      parts = Array.from(new Intl.Segmenter(undefined, { granularity: 'word' }).segment(text), function (part) { return part.segment; });
    }
    parts.forEach(function (part) {
      var word = makeWord(part);
      if (!word.core) {
        if (units.length) units[units.length - 1].suffix += (spaced ? ' ' : '') + part;
        else prefix += part + (spaced ? ' ' : '');
        return;
      }
      word.prefix = prefix + word.prefix;
      prefix = '';
      units.push(word);
    });
    return { words: units, separator: spaced ? ' ' : '' };
  }
  var answers = readArray(find('.ft-answer-source'));
  var transcripts = answers.map(transcript).filter(function (item) { return item.words.length; });
  function target() { return transcripts[selected] || { words: [], separator: ' ' }; }
  function record(index) {
    if (!records[index]) records[index] = { typed: '', key: '', submitted: false, revealed: 0 };
    return records[index];
  }
  function setRecord(index, text, submitted) {
    var item = record(index);
    item.typed = text;
    item.key = makeWord(normalize(text)).key;
    item.submitted = submitted;
  }
  function matches(index, words) {
    return !!(words[index] && records[index] && records[index].key === words[index].key);
  }
  function score(item) {
    var right = 0;
    var prefix = 0;
    var extras = 0;
    records.forEach(function (entry, index) {
      if (!entry || !entry.key) return;
      if (matches(index, item.words)) right += 1;
      if (index >= item.words.length) extras += 1;
    });
    while (prefix < item.words.length && matches(prefix, item.words)) prefix += 1;
    var complete = item.words.every(function (word, index) {
      return matches(index, item.words) && records[index].submitted;
    }) && !extras;
    return [complete ? 1 : 0, right - extras, prefix];
  }
  function chooseTranscript() {
    var best = selected;
    var bestScore = score(target());
    transcripts.forEach(function (item, index) {
      var candidate = score(item);
      for (var i = 0; i < candidate.length; i++) {
        if (candidate[i] === bestScore[i]) continue;
        if (candidate[i] > bestScore[i]) { best = index; bestScore = candidate; }
        break;
      }
    });
    selected = best;
  }
  function visibleCount() {
    var count = target().words.length;
    records.forEach(function (item, index) {
      if (item && (item.key || item.submitted)) count = Math.max(count, index + 1);
    });
    return count;
  }
  function state(index) {
    var item = records[index];
    if (matches(index, target().words)) return 'correct';
    return item && item.submitted ? 'wrong' : 'pending';
  }
  function render() {
    chooseTranscript();
    var words = target().words;
    var count = visibleCount();
    if (wordNodes.length !== count || renderedSeparator !== target().separator) {
      var fragment = document.createDocumentFragment();
      wordNodes = [];
      for (var i = 0; i < count; i++) {
        if (i) fragment.append(document.createTextNode(target().separator));
        var button = document.createElement('button');
        button.type = 'button';
        button.setAttribute('data-index', i);
        wordNodes.push(button);
        fragment.append(button);
      }
      passage.replaceChildren(fragment);
      renderedSeparator = target().separator;
    }
    var right = 0;
    var wrong = 0;
    wordNodes.forEach(function (button, index) {
      var item = records[index] || { typed: '', revealed: 0 };
      var word = words[index] || makeWord(item.typed);
      var kind = state(index);
      if (kind === 'correct') right += 1;
      if (kind === 'wrong') wrong += 1;
      var revealed = Math.min(item.revealed || 0, word.chars.length);
      var text = kind === 'correct' ? word.core : word.chars.slice(0, revealed).join('') +
        (kind === 'wrong' ? 'x' : '-').repeat(Math.max(word.chars.length - revealed, 0));
      var label = 'Từ ' + (index + 1) + (kind === 'correct' ? ', đúng: ' + word.core :
        kind === 'wrong' ? ', chưa đúng. Bấm để gõ lại.' : ', chưa gõ.');
      if (index >= words.length) label = 'Từ thừa ' + (index + 1) + '. Bấm để xóa.';
      var className = 'ft-dict-word is-' + kind + (index === active ? ' is-active' : '');
      if (button.className !== className) button.className = className;
      var display = word.prefix + text + word.suffix;
      if (button.textContent !== display) button.textContent = display;
      button.setAttribute('aria-label', label);
      button.setAttribute('aria-pressed', String(index === active));
    });
    var complete = transcripts.length && score(target())[0] === 1;
    progress.textContent = right + '/' + words.length + ' từ đúng';
    position.textContent = active < 0 ? '· hoàn thành' : active >= words.length
      ? '· từ thừa' : '· ' + (active + 1) + '/' + words.length;
    input.disabled = active < 0;
    input.placeholder = active < 0 ? 'Bấm vào một từ để gõ lại' : 'Gõ từ bạn nghe được…';
    checkButton.disabled = composing || active < 0 || !normalize(input.value);
    hint.disabled = composing || active < 0 || !words[active] || state(active) === 'correct' ||
      record(active).revealed >= words[active].chars.length;
    removeButton.hidden = active < words.length;
    resetButton.disabled = !records.some(function (item) { return item && (item.typed || item.revealed); });
    form.classList.toggle('is-correct', !!complete);
    form.classList.toggle('is-incorrect', !complete && active >= 0 && state(active) === 'wrong');
    input.setAttribute('aria-invalid', !complete && active >= 0 && state(active) === 'wrong' ? 'true' : 'false');
    status.className = 'ft-status' + (complete ? ' is-correct' : wrong ? ' is-incorrect' : '');
    status.textContent = complete ? 'Đã chép đúng cả đoạn. Lật thẻ để xem bản dịch và ghi chú.' :
      wrong ? 'Còn ' + wrong + ' từ chưa đúng. Bấm vào từ màu đỏ để sửa.' : '';
  }
  function showActive() {
    var button = wordNodes[active];
    if (!button) return;
    var box = passage.getBoundingClientRect();
    var bounds = button.getBoundingClientRect();
    if (bounds.top < box.top + 12) passage.scrollTop -= box.top + 12 - bounds.top;
    else if (bounds.bottom > box.bottom - 12) passage.scrollTop += bounds.bottom - box.bottom + 12;
  }
  function activate(index, selectText, focusEditor) {
    active = index;
    input.value = index >= 0 ? record(index).typed : '';
    render();
    showActive();
    if (index >= 0 && focusEditor !== false) {
      input.focus();
      if (selectText) input.select();
    }
  }
  function nextUnfinished(after) {
    var count = visibleCount();
    for (var step = 1; step <= count; step++) {
      var index = (after + step) % count;
      if (!matches(index, target().words) || !records[index].submitted) return index;
    }
    return -1;
  }
  function consume(text, finalize) {
    if (active < 0 || composing) return;
    var pieces = transcript(text).words.map(function (word) { return word.prefix + word.core + word.suffix; });
    if (!pieces.length) { input.value = ''; render(); return; }
    var all = finalize || /[\s\u3000]$/.test(text);
    var committed = all ? pieces.length : pieces.length - 1;
    var start = active;
    for (var i = 0; i < committed; i++) setRecord(start + i, pieces[i], true);
    if (!all) setRecord(start + committed, pieces[committed], false);
    chooseTranscript();
    if (all) activate(nextUnfinished(start + committed - 1), true);
    else activate(start + committed, false);
  }
  function edited() {
    if (active < 0) return;
    if (!composing && /[\s\u3000]/.test(input.value)) { consume(input.value, false); return; }
    setRecord(active, input.value, false);
    render();
  }
  // Keep one small editor, even for a transcript with hundreds of words.
  if (!input) {
    input = document.createElement('input');
    input.className = 'ft-input';
    input.id = 'ft-input';
    input.type = 'text';
    find('.ft-input-wrap').prepend(input);
  }
  input.autocomplete = 'off';
  input.spellcheck = false;
  input.setAttribute('autocapitalize', 'off');
  input.setAttribute('aria-describedby', 'ft-status ft-entry-help');
  input.setAttribute('aria-keyshortcuts', 'Space Enter');
  input.addEventListener('compositionstart', function () { composing = true; render(); });
  input.addEventListener('compositionend', function () { composing = false; edited(); });
  input.addEventListener('input', edited);
  input.addEventListener('keydown', function (event) {
    if (event.isComposing || composing || event.keyCode === 229) return;
    if (event.key === ' ' || event.key === 'Enter') {
      event.preventDefault();
      consume(input.value, true);
    } else if (event.key === 'Backspace' && !input.value && active > 0) {
      event.preventDefault();
      activate(active - 1, true);
    }
  });
  checkButton.addEventListener('click', function () { consume(input.value, true); });
  passage.addEventListener('click', function (event) {
    var button = event.target.closest('.ft-dict-word');
    if (button && passage.contains(button)) activate(Number(button.getAttribute('data-index')), true);
  });
  hint.addEventListener('click', function () {
    if (active < 0 || !target().words[active] || composing) return;
    var item = record(active);
    item.revealed = Math.min(target().words[active].chars.length, item.revealed + 1);
    render();
    input.focus();
  });
  removeButton.addEventListener('click', function () {
    if (active < target().words.length) return;
    var removed = active;
    records.splice(active, 1);
    render();
    activate(nextUnfinished(removed - 1), true);
  });
  resetButton.addEventListener('click', function () {
    records = [];
    selected = 0;
    activate(0, false);
  });
  // Audio only starts on a learner click. Multiple clips play in order.
  var audioPanel = find('.ft-audio');
  if (audioPanel) {
    var tracks = Array.from(audioPanel.querySelectorAll('audio'));
    var play = audioPanel.querySelector('.ft-play');
    var playLabel = audioPanel.querySelector('.ft-play-label');
    var audioStatus = audioPanel.querySelector('.ft-audio-status');
    var playing = false;
    var trackIndex = 0;
    var attempt = 0;
    var played = false;
    function idle() {
      playing = false;
      audioPanel.classList.remove('is-playing');
      play.setAttribute('aria-pressed', 'false');
      playLabel.textContent = played ? 'Nghe lại' : 'Nghe âm thanh';
    }
    function stop() {
      attempt += 1;
      tracks.forEach(function (track) { track.pause(); track.currentTime = 0; });
      idle();
    }
    function startTrack() {
      var ticket = attempt;
      var track = tracks[trackIndex];
      if (!track) { idle(); return; }
      playing = true;
      played = true;
      audioPanel.classList.add('is-playing');
      play.setAttribute('aria-pressed', 'true');
      playLabel.textContent = 'Dừng âm thanh';
      audioStatus.textContent = '';
      function failed() {
        if (ticket !== attempt) return;
        idle();
        audioStatus.textContent = 'Chưa phát được âm thanh. Nhấn nghe để thử lại.';
      }
      try { Promise.resolve(track.play()).catch(failed); } catch (error) { failed(); }
    }
    tracks.forEach(function (track, index) {
      track.preload = 'none';
      track.removeAttribute('autoplay');
      track.addEventListener('ended', function () {
        if (!playing || index !== trackIndex) return;
        if (trackIndex < tracks.length - 1) { trackIndex += 1; startTrack(); }
        else idle();
      });
      track.addEventListener('error', function () {
        if (!playing || index !== trackIndex) return;
        stop();
        audioStatus.textContent = 'Chưa tải được âm thanh. Nhấn nghe để thử lại.';
      });
    });
    play.addEventListener('click', function () {
      if (playing) { stop(); return; }
      attempt += 1;
      trackIndex = 0;
      tracks.forEach(function (track) { track.currentTime = 0; });
      startTrack();
    });
    if (!tracks.length) audioPanel.hidden = true;
  }
  if (!transcripts.length) {
    form.hidden = true;
    guide.hidden = true;
    find('.ft-empty').hidden = false;
  } else {
    activate(0, false, false);
  }
})();
</script>
