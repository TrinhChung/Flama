services:
  db:
    image: mysql:8.0
    container_name: flama_db
    restart: always
    environment:
      MYSQL_DATABASE: flama
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-your-db-password}
    volumes:
      - flama_db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  web:
    build: .
    container_name: flama_app
    restart: always
    depends_on:
      - db
    ports:
      - "4789:4789"
    environment:
      - FLASK_APP=wsgi.py
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-your-db-password}
      - DB_NAME=flama
      - USE_NEW_CARD_MODEL=true
      - FLASHCARD_MEDIA_MAX_BYTES=10485760

volumes:
  flama_db_data:
