# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name api.flama.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    client_max_body_size 20m;
    server_name api.flama.vn;

    # ===== Cloudflare Origin SSL Certificate =====
    ssl_certificate     /etc/ssl/certs/flama.vn.crt;
    ssl_certificate_key /etc/ssl/private/flama.vn.key;

    # ===== SSL Settings =====
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ===== Security Headers =====
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # ===== Internal media serving (X-Accel-Redirect) =====
    # Flask returns X-Accel-Redirect header; Nginx serves the file directly.
    # This block is NOT accessible from outside — only via internal redirect.
    location /internal-media/ {
        internal;
        alias /var/lib/flama/media/;
        sendfile on;
        more_set_headers "Cache-Control: public, max-age=3600, s-maxage=86400";
        more_clear_headers "Vary" "Set-Cookie";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # Public, authorization-independent media store / proxy. Strip session-specific
    # upstream headers before the internal redirect so Cloudflare can safely
    # share one cached response while older app releases are still running.
    location = /media/proxy {
        return 404;
        more_set_headers "Cache-Control: no-cache, no-store, must-revalidate, max-age=0" "Pragma: no-cache";
    }

    location = /store {
        return 404;
        more_set_headers "Cache-Control: no-cache, no-store, must-revalidate, max-age=0" "Pragma: no-cache";
    }

    # Canonical media store location proxying to media store upstream
    location ^~ /store/ {
        proxy_pass http://127.0.0.1:4789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Vary;
        proxy_hide_header Set-Cookie;
        more_set_headers -s 400,403,404,405,410,500,502,503,504 "Cache-Control: no-cache, no-store, must-revalidate, max-age=0" "Pragma: no-cache";
    }

    location ^~ /media/proxy/ {
        proxy_pass http://127.0.0.1:4789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Vary;
        proxy_hide_header Set-Cookie;
        more_set_headers -s 400,403,404,405,410,500,502,503,504 "Cache-Control: no-cache, no-store, must-revalidate, max-age=0" "Pragma: no-cache";
    }

    # ===== Reverse Proxy =====
    location / {
        if ($query_string ~* "union.*select.*\(")        { return 403; }
        if ($query_string ~* "select.+from")              { return 403; }
        if ($query_string ~* "insert\s+into")            { return 403; }
        if ($query_string ~* "drop\s+table")             { return 403; }
        if ($query_string ~* "information_schema")        { return 403; }
        if ($query_string ~* "sleep\((\s*)(\d*)(\s*)\)") { return 403; }

        # --- Reverse Proxy ---
        proxy_pass http://127.0.0.1:4789;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
