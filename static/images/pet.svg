                    values="0.92;0.92;0.55;0;0;0.92;0.92;0.55;0;0;0.92;0.92"/>
                  <animate attributeName="rx" values="6;6.7;5.9;6.4;6" dur="2.0s" repeatCount="indefinite"/>
