<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Flame mascot">
  <defs>
    <linearGradient id="flameGrad" x1="512" y1="164" x2="512" y2="744" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB11A"/>
      <stop offset="48%" stop-color="#FF7800"/>
      <stop offset="100%" stop-color="#FF4700"/>
    </linearGradient>

    <radialGradient id="eyeGrad" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#1A1E27"/>
      <stop offset="75%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <radialGradient id="shadowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#000000" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadowBlur" x="-40%" y="-120%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- ground shadow: cute jump once -->
  <g id="ground-shadow">
    <ellipse cx="513" cy="808" rx="152" ry="38" fill="url(#shadowGrad)" filter="url(#shadowBlur)" opacity="0.78">
      <animate attributeName="rx"
        values="152;164;112;152;146;152"
        keyTimes="0;0.12;0.42;0.72;0.86;1"
        calcMode="spline"
        keySplines="0.25 0.8 0.3 1; 0.22 0.9 0.3 1; 0.2 0 0.2 1; 0.2 0.7 0.2 1; 0.2 0.7 0.2 1"
        dur="1.15s"
        begin="0s"
        repeatCount="1"
        fill="freeze"/>
      <animate attributeName="ry"
        values="38;42;26;38;36;38"
        keyTimes="0;0.12;0.42;0.72;0.86;1"
        calcMode="spline"
        keySplines="0.25 0.8 0.3 1; 0.22 0.9 0.3 1; 0.2 0 0.2 1; 0.2 0.7 0.2 1; 0.2 0.7 0.2 1"
        dur="1.15s"
        begin="0s"
        repeatCount="1"
        fill="freeze"/>
      <animate attributeName="opacity"
        values="0.78;0.88;0.36;0.78;0.7;0.78"
        keyTimes="0;0.12;0.42;0.72;0.86;1"
        calcMode="spline"
        keySplines="0.25 0.8 0.3 1; 0.22 0.9 0.3 1; 0.2 0 0.2 1; 0.2 0.7 0.2 1; 0.2 0.7 0.2 1"
        dur="1.15s"
        begin="0s"
        repeatCount="1"
        fill="freeze"/>
    </ellipse>
  </g>

  <!-- flame + face -->
  <g id="flame-body-motion">
