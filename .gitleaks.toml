# Gitleaks Configuration for Flama Repository
# Defines detection rules for leaked infrastructure credentials and gateway tokens.
# Real server IPs and retired secrets are not listed here (this file is public);
# scripts/check_secrets_staged.py checks them from a CI secret / the private infra-vpn submodule.

title = "Flama Secret Scanner Configuration"

[extend]
# Inherit built-in Gitleaks base rules (AWS keys, GitHub tokens, Generic API keys, etc.)
useDefault = true

[allowlist]
description = "Private submodule, scanner rule files, and test fixtures (tests are still covered by scripts/check_secrets_staged.py --all)"
paths = [
    '''^infra-vpn/''',
    '''^\.gitleaks\.toml$''',
    '''^scripts/check_secrets_staged\.py$''',
    '''^tests/''',
]
stopwords = [
    "REDACTED",
    "REDACTED_GATEWAY_SECRET",
    "REDACTED_OAUTH_CLIENT_ID",
    "127.0.0.1",
    "192.0.2.151",
    "198.51.100.141",
    "203.0.113.226",
    "CHANGE_ME_SECRET",
    "test-api-key",
    "test-checksum-key",
]

[[rules]]
id = "flama-gateway-secret"
description = "Detected Flama Gateway Secret Token (flama_gw_sec_*)"
regex = '''\b(?i)flama_gw_sec_[a-f0-9]{32}'''
keywords = ["flama_gw_sec_"]

[[rules]]
id = "flama-internal-secret"
description = "Detected Flama internal service secret (flama_int_sec_*)"
regex = '''\b(?i)flama_int_sec_[a-f0-9]{32}'''
keywords = ["flama_int_sec_"]

[[rules]]
id = "internal-wireguard-ip"
description = "Detected internal WireGuard mesh host address (use wg-app-server, wg-gateway, wg-worker212)"
regex = '''\b10\.10\.0\.(?:25[0-4]|2[0-4]\d|1\d\d|[1-9]\d?)\b'''
keywords = ["10.10.0."]

[[rules]]
id = "flama-private-key"
description = "Detected unencrypted Private Key header"
regex = '''(?i)-----BEGIN[ A-Z0-9_-]+PRIVATE KEY-----'''
keywords = [
    "-----BEGIN",
    "PRIVATE KEY",
]

[[rules]]
id = "personal-admin-email"
description = "Detected personal admin email in workflow or deployment configs"
regex = '''\b[a-zA-Z0-9._%+-]+@gmail\.com\b'''
keywords = ["@gmail.com"]
path = '''^(\.github/workflows/|deploy/)'''

[[rules]]
id = "production-ssl-cert-path"
description = "Detected production SSL private key path in configs"
regex = '''/etc/letsencrypt/live/[a-zA-Z0-9._-]+/privkey\.pem'''
keywords = ["/privkey.pem", "letsencrypt"]
