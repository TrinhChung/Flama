{# Component: Text Input Field #}
{# Usage: {% include 'components/forms/text_input.html' with context %} #}
{# Params: field_id, field_name, label, placeholder, required, value #}

<div class="form-group mb-3">
  <label for="{{ field_id }}" class="form-label">{{ label }}</label>
  <input
    type="text"
    class="form-control"
    id="{{ field_id }}"
    name="{{ field_name }}"
    placeholder="{{ placeholder or '' }}"
    value="{{ value or '' }}"
    {{ 'required' if required else '' }}
  />
</div>
