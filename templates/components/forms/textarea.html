{# Component: Textarea Field #}
{# Usage: {% include 'components/forms/textarea.html' with context %} #}
{# Params: field_id, field_name, label, placeholder, required, value, rows #}

<div class="form-group mb-3">
  <label for="{{ field_id }}" class="form-label">{{ label }}</label>
  <textarea
    class="form-control"
    id="{{ field_id }}"
    name="{{ field_name }}"
    placeholder="{{ placeholder or '' }}"
    rows="{{ rows or 3 }}"
    {{ 'required' if required else '' }}
  >{{ value or '' }}</textarea>
</div>
