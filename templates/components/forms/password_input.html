{# Component: Password Input Field #}
{# Usage: {% include 'components/forms/password_input.html' with context %} #}
{# Params: field_id, field_name, label, placeholder, required #}

<div class="form-group mb-3">
  <label for="{{ field_id }}" class="form-label">{{ label }}</label>
  <input
    type="password"
    class="form-control"
    id="{{ field_id }}"
    name="{{ field_name }}"
    placeholder="{{ placeholder or '••••••••' }}"
    required
  />
</div>
