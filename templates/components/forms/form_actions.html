{# Component: Form Submit/Cancel Actions #}
{# Usage: {% include 'components/forms/form_actions.html' with context %} #}
{# Params: submit_label, cancel_url, submit_class, cancel_class #}

<div class="form-actions d-flex gap-2 justify-content-end">
  {% if cancel_url %}
  <a href="{{ cancel_url }}" class="btn btn-{{ cancel_class or 'outline-secondary' }}">Cancel</a>
  {% endif %}
  <button type="submit" class="btn btn-{{ submit_class or 'primary' }}">{{ submit_label or 'Submit' }}</button>
</div>
