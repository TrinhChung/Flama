{# Component: Primary Button #}
{# Usage: {% include 'components/buttons/primary.html' with context %} #}
{# Params: label, id, classes, onclick, disabled #}

<button
  type="button"
  class="btn btn-primary {{ classes or '' }}"
  id="{{ id or '' }}"
  onclick="{{ onclick or '' }}"
  {{ 'disabled' if disabled else '' }}
>
  {{ label }}
</button>
