{% extends "base.html" %}

{% block title %}Nhập CSV{% endblock %}

{% block content %}
<div class="row">
  <div class="col-lg-8 mx-auto">
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="card-title">Nhập dữ liệu CSV</h2>
        <p class="text-muted">
          Dán nội dung CSV (bao gồm dòng tiêu đề). Các cột bắt buộc: <code>Deck</code>, <code>Word</code>.
        </p>
        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="lesson_id">Chọn bài học</label>
            <select class="form-select" id="lesson_id" name="lesson_id" required>
              {% if levels %}
              <option value="" disabled {% if not selected_lesson_id %}selected{% endif %}>
                -- Chọn trình độ / chủ đề / bài học --
              </option>
              {% for level in levels %}
                {% for topic in level.topics %}
                  {% for lesson in topic.lessons %}
                  <option
                    value="{{ lesson.id }}"
                    {% if selected_lesson_id == lesson.id %}selected{% endif %}
                  >
                    {{ level.name }} / {{ topic.name }} / {{ lesson.title }}
                  </option>
                  {% endfor %}
                {% endfor %}
              {% endfor %}
              {% else %}
              <option value="" selected disabled>Chưa có bài học nào. Hãy tạo trước.</option>
              {% endif %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="csv_content">Nội dung CSV</label>
            <textarea
              class="form-control"
              id="csv_content"
              name="csv_content"
              rows="10"
              placeholder="Deck,Word,hanviet,Reading,Translation_VI,..."
            >{{ csv_content or "" }}</textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Tiêu đề mẫu</label>
            <div class="form-text">
              {{ sample_headers | join(", ") }}
            </div>
          </div>
          <div class="d-flex justify-content-between">
            <a class="btn btn-outline-secondary" href="{{ url_for('vocabulary.index') }}">Hủy</a>
            <button class="btn btn-primary" type="submit">Nhập dữ liệu</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
