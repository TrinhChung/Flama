{% extends "base.html" %}

{% block title %}Edit NoteType{% endblock %}

{% block content %}
<section class="py-3" data-note-type-id="{{ note_type.id }}" id="note-type-detail-root">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <div>
      <h2 class="h4 mb-0">{{ note_type.name }}</h2>
      <small class="text-muted">Field + template management</small>
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('flashcards.note_type_manager') }}">Back</a>
      <a class="btn btn-primary btn-sm" href="{{ url_for('flashcards.note_editor_page') }}?note_type_id={{ note_type.id }}">Create Note</a>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-lg-5">
      <div class="card card-body">
        <h3 class="h6">Fields</h3>
        <div class="table-responsive">
          <table class="table table-sm align-middle mb-2">
            <thead>
              <tr>
                <th>Name</th>
                <th>Type</th>
                <th>Req</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="field-list-body"></tbody>
          </table>
        </div>
        <form id="add-field-form" class="border-top pt-3">
          <div class="row g-2">
            <div class="col-5">
              <input class="form-control form-control-sm" id="new-field-name" placeholder="PitchAccent" />
            </div>
            <div class="col-4">
              <select class="form-select form-select-sm" id="new-field-type">
                <option value="text">text</option>
                <option value="richtext">richtext</option>
                <option value="image">image</option>
                <option value="audio">audio</option>
                <option value="diagram">diagram</option>
              </select>
            </div>
            <div class="col-3 d-grid">
              <button class="btn btn-sm btn-primary" type="submit">Add</button>
            </div>
          </div>
          <small id="field-error" class="text-danger d-none mt-2"></small>
        </form>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="card card-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h3 class="h6 mb-0">Template Editor</h3>
          <div class="d-flex gap-2">
            <select class="form-select form-select-sm" id="template-select"></select>
            <button class="btn btn-sm btn-outline-secondary" id="new-template-btn">New</button>
            <button class="btn btn-sm btn-outline-warning" id="reset-template-btn">Reset</button>
          </div>
        </div>
        <div class="mb-2">
          <small class="text-muted">Insert placeholder:</small>
          <div id="placeholder-toolbar" class="d-flex flex-wrap gap-1 mt-1"></div>
        </div>
        <div class="row g-2">
          <div class="col-12">
            <label class="form-label small mb-1">Front HTML</label>
            <textarea id="front-html" class="form-control font-monospace" rows="6"></textarea>
          </div>
          <div class="col-12">
            <label class="form-label small mb-1">Back HTML</label>
            <textarea id="back-html" class="form-control font-monospace" rows="8"></textarea>
          </div>
          <div class="col-12">
            <label class="form-label small mb-1">Shared CSS</label>
            <textarea id="shared-css" class="form-control font-monospace" rows="5"></textarea>
          </div>
        </div>
        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-primary btn-sm" id="save-template-btn">Save</button>
          <select id="preview-note-id" class="form-select form-select-sm" style="max-width:260px;">
            <option value="">Preview with first note</option>
            {% for note in notes %}
            <option value="{{ note.id }}">Note {{ loop.index }} - {{ note.id[:8] }}</option>
            {% endfor %}
          </select>
        </div>
        <small id="template-error" class="text-danger d-none mt-2"></small>
        <div class="mt-3">
          <label class="form-label small mb-1">Realtime Preview</label>
          <iframe id="template-preview-frame" class="w-100 border rounded" style="min-height: 260px;" sandbox="allow-same-origin"></iframe>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
  (() => {
    const root = document.getElementById("note-type-detail-root");
    if (!root) return;
    const noteTypeId = root.getAttribute("data-note-type-id");

    const fieldListBody = document.getElementById("field-list-body");
    const fieldError = document.getElementById("field-error");
    const addFieldForm = document.getElementById("add-field-form");
    const newFieldName = document.getElementById("new-field-name");
    const newFieldType = document.getElementById("new-field-type");

    const templateSelect = document.getElementById("template-select");
    const frontHtml = document.getElementById("front-html");
    const backHtml = document.getElementById("back-html");
    const sharedCss = document.getElementById("shared-css");
    const templateError = document.getElementById("template-error");
    const previewFrame = document.getElementById("template-preview-frame");
    const previewNoteId = document.getElementById("preview-note-id");
    const placeholderToolbar = document.getElementById("placeholder-toolbar");

    let noteType = null;
    let templates = [];
    let selectedTemplateId = null;
    let previewTimer = null;

    function showError(el, msg) {
      el.textContent = msg || "Request failed.";
      el.classList.remove("d-none");
    }

    function clearError(el) {
      el.textContent = "";
      el.classList.add("d-none");
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.message || "Request failed.");
      return data;
    }

    function selectedTemplate() {
      return templates.find((item) => item.id === selectedTemplateId);
    }

    function renderFields() {
      fieldListBody.innerHTML = "";
      const fields = (noteType?.field_defs || []).slice().sort((a, b) => a.position - b.position);
      fields.forEach((field, index) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><input class="form-control form-control-sm field-name-input" value="${field.name}" /></td>
          <td>
            <select class="form-select form-select-sm field-type-input">
              ${["text", "richtext", "image", "audio", "diagram"].map((t) => `<option value="${t}" ${field.field_type === t ? "selected" : ""}>${t}</option>`).join("")}
            </select>
          </td>
          <td class="text-center"><input type="checkbox" class="form-check-input field-required-input" ${field.required ? "checked" : ""} /></td>
          <td class="text-nowrap">
            <button class="btn btn-sm btn-outline-success field-save-btn">Save</button>
            <button class="btn btn-sm btn-outline-danger field-delete-btn ms-1">Del</button>
            <button class="btn btn-sm btn-outline-secondary field-up-btn ms-1" ${index === 0 ? "disabled" : ""}>↑</button>
            <button class="btn btn-sm btn-outline-secondary field-down-btn" ${index === fields.length - 1 ? "disabled" : ""}>↓</button>
          </td>
        `;
        tr.querySelector(".field-save-btn").addEventListener("click", () => updateField(field.id, tr));
        tr.querySelector(".field-delete-btn").addEventListener("click", () => deleteField(field.id));
        tr.querySelector(".field-up-btn").addEventListener("click", () => moveField(field.id, -1));
        tr.querySelector(".field-down-btn").addEventListener("click", () => moveField(field.id, 1));
        fieldListBody.appendChild(tr);
      });

      placeholderToolbar.innerHTML = "";
      fields.forEach((field) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "btn btn-outline-secondary btn-sm";
        button.textContent = `{{${field.name}}}`;
        button.addEventListener("click", () => insertPlaceholder(`{{${field.name}}}`));
        placeholderToolbar.appendChild(button);
      });
    }

    function renderTemplateSelect() {
      templateSelect.innerHTML = "";
      templates.forEach((template) => {
        const option = document.createElement("option");
        option.value = template.id;
        option.textContent = template.name;
        templateSelect.appendChild(option);
      });
      if (!selectedTemplateId && templates.length) selectedTemplateId = templates[0].id;
      templateSelect.value = selectedTemplateId || "";
      loadTemplateIntoEditor();
    }

    function loadTemplateIntoEditor() {
      const template = selectedTemplate();
      if (!template) return;
      frontHtml.value = template.front_html || "";
      backHtml.value = template.back_html || "";
      sharedCss.value = template.shared_css || "";
      debouncedPreview();
    }

    function insertPlaceholder(text) {
      const target = document.activeElement === backHtml ? backHtml : frontHtml;
      if (!target) return;
      const start = target.selectionStart || 0;
      const end = target.selectionEnd || 0;
      const current = target.value || "";
      target.value = current.slice(0, start) + text + current.slice(end);
      target.selectionStart = target.selectionEnd = start + text.length;
      debouncedPreview();
      target.focus();
    }

    async function refreshNoteType() {
      noteType = await requestJson(`/api/note-types/${noteTypeId}`);
      templates = noteType.templates || [];
      renderFields();
      renderTemplateSelect();
    }

    async function updateField(fieldId, row) {
      clearError(fieldError);
      const payload = {
        name: row.querySelector(".field-name-input")?.value?.trim(),
        field_type: row.querySelector(".field-type-input")?.value,
        required: row.querySelector(".field-required-input")?.checked,
      };
      try {
        await requestJson(`/api/note-types/${noteTypeId}/fields/${fieldId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        await refreshNoteType();
      } catch (error) {
        showError(fieldError, error.message);
      }
    }

    async function deleteField(fieldId) {
      clearError(fieldError);
      if (!window.confirm("Delete this field? Existing values will be removed.")) return;
      try {
        await requestJson(`/api/note-types/${noteTypeId}/fields/${fieldId}`, { method: "DELETE" });
        await refreshNoteType();
      } catch (error) {
        showError(fieldError, error.message);
      }
    }

    async function moveField(fieldId, delta) {
      const fields = (noteType?.field_defs || []).slice().sort((a, b) => a.position - b.position);
      const index = fields.findIndex((f) => f.id === fieldId);
      const nextIndex = index + delta;
      if (index < 0 || nextIndex < 0 || nextIndex >= fields.length) return;
      const swapped = fields.slice();
      const temp = swapped[index];
      swapped[index] = swapped[nextIndex];
      swapped[nextIndex] = temp;
      const payload = swapped.map((field, position) => ({ id: field.id, position }));
      try {
        await requestJson(`/api/note-types/${noteTypeId}/fields/reorder`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        await refreshNoteType();
      } catch (error) {
        showError(fieldError, error.message);
      }
    }

    async function saveTemplate() {
      clearError(templateError);
      if (!selectedTemplateId) return;
      const payload = {
        front_html: frontHtml.value,
        back_html: backHtml.value,
        shared_css: sharedCss.value,
      };
      try {
        const saved = await requestJson(`/api/note-types/${noteTypeId}/templates/${selectedTemplateId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        templates = templates.map((item) => item.id === saved.id ? saved : item);
        debouncedPreview();
      } catch (error) {
        showError(templateError, error.message);
      }
    }

    async function runPreview() {
      clearError(templateError);
      if (!selectedTemplateId) return;
      try {
        const preview = await requestJson(`/api/note-types/${noteTypeId}/templates/${selectedTemplateId}/preview`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ note_id: previewNoteId.value || null }),
        });
        previewFrame.srcdoc = `
          <!doctype html>
          <html><body>
          <div style="padding:8px;border-bottom:1px solid #ddd">${preview.front_html || ""}</div>
          <div style="padding:8px">${preview.back_html || ""}</div>
          </body></html>
        `;
      } catch (error) {
        showError(templateError, error.message);
      }
    }

    function debouncedPreview() {
      if (previewTimer) window.clearTimeout(previewTimer);
      previewTimer = window.setTimeout(runPreview, 600);
    }

    addFieldForm?.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearError(fieldError);
      try {
        await requestJson(`/api/note-types/${noteTypeId}/fields`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: newFieldName.value.trim(),
            field_type: newFieldType.value,
            required: false,
          }),
        });
        newFieldName.value = "";
        await refreshNoteType();
      } catch (error) {
        showError(fieldError, error.message);
      }
    });

    document.getElementById("save-template-btn")?.addEventListener("click", saveTemplate);
    document.getElementById("new-template-btn")?.addEventListener("click", async () => {
      try {
        const created = await requestJson(`/api/note-types/${noteTypeId}/templates`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: `Card ${templates.length + 1}`, front_html: "{{Word}}", back_html: "{{Word}}" }),
        });
        templates.push(created);
        selectedTemplateId = created.id;
        renderTemplateSelect();
      } catch (error) {
        showError(templateError, error.message);
      }
    });

    document.getElementById("reset-template-btn")?.addEventListener("click", async () => {
      if (!selectedTemplateId || !window.confirm("Reset template to legacy default?")) return;
      try {
        const reset = await requestJson(`/api/note-types/${noteTypeId}/templates/${selectedTemplateId}/reset`, { method: "POST" });
        templates = templates.map((item) => item.id === reset.id ? reset : item);
        loadTemplateIntoEditor();
      } catch (error) {
        showError(templateError, error.message);
      }
    });

    templateSelect?.addEventListener("change", () => {
      selectedTemplateId = templateSelect.value;
      loadTemplateIntoEditor();
    });
    previewNoteId?.addEventListener("change", runPreview);
    [frontHtml, backHtml, sharedCss].forEach((el) => el?.addEventListener("input", debouncedPreview));

    refreshNoteType().catch((error) => showError(fieldError, error.message));
  })();
</script>
{% endblock %}
