{% extends "base.html" %}

{% block title %}Note Editor{% endblock %}

{% block content %}
<section class="py-3" id="note-editor-root">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
    <h2 class="h4 mb-0">Dynamic Note Editor</h2>
    <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('flashcards.note_type_manager') }}">Back</a>
  </div>

  <form id="note-editor-form" class="card card-body">
    <div class="row g-2">
      <div class="col-md-5">
        <label class="form-label">NoteType</label>
        <select id="note-type-select" class="form-select">
          <option value="">Select note type</option>
          {% for note_type in note_types %}
          <option value="{{ note_type.id }}" {% if request.args.get('note_type_id') == note_type.id %}selected{% endif %}>
            {{ note_type.name }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label">Deck</label>
        <select id="deck-select" class="form-select">
          <option value="">No deck</option>
          {% for deck in decks %}
          <option value="{{ deck.id }}">{{ deck.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label">Tags (comma-separated)</label>
        <input class="form-control" id="tags-input" placeholder="Word,Reading,JLPT-N1" />
      </div>
    </div>

    <div id="dynamic-fields" class="mt-3"></div>

    <div class="d-flex gap-2 mt-3">
      <button class="btn btn-primary" type="submit">Save Note</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('flashcards.note_type_manager') }}">Cancel</a>
    </div>
    <small id="note-editor-error" class="text-danger d-none mt-2"></small>
    <small id="note-editor-success" class="text-success d-none mt-2"></small>
  </form>
</section>
{% endblock %}

{% block scripts %}
<style>
  #dynamic-fields textarea[data-markdown-editor="1"] {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  }

  .note-editor-markdown-hint {
    margin-top: 0.3rem;
    font-size: 0.74rem;
    color: #6c757d;
  }

  .note-editor-markdown-preview {
    margin-top: 0.4rem;
    border: 1px solid #dee2e6;
    border-radius: 8px;
    background: #fff;
    padding: 0.5rem 0.6rem;
    max-height: 180px;
    overflow: auto;
  }

  .note-editor-markdown-preview-empty {
    color: #6c757d;
    font-size: 0.76rem;
  }

  .note-editor-markdown-preview-text {
    color: #4a4a4a;
    font-size: 0.8rem;
    line-height: 1.45;
    margin-bottom: 0.35rem;
    word-break: break-word;
  }

  .note-editor-markdown-preview-text:last-child {
    margin-bottom: 0;
  }

  .note-editor-markdown-preview-figure {
    margin: 0 0 0.4rem;
  }

  .note-editor-markdown-preview-figure:last-child {
    margin-bottom: 0;
  }

  .note-editor-markdown-preview-figure img {
    display: block;
    max-width: 100%;
    height: auto;
    border-radius: 6px;
    border: 1px solid #e5e7eb;
    background: #fff;
  }
</style>
<script>
  (() => {
    const noteTypeSelect = document.getElementById("note-type-select");
    const deckSelect = document.getElementById("deck-select");
    const tagsInput = document.getElementById("tags-input");
    const dynamicFields = document.getElementById("dynamic-fields");
    const form = document.getElementById("note-editor-form");
    const errorEl = document.getElementById("note-editor-error");
    const successEl = document.getElementById("note-editor-success");
    const MARKDOWN_PROXY_MEDIA_RE = /^\/media\/proxy\/[A-Za-z0-9][A-Za-z0-9_-]{0,127}$/;

    let currentFields = [];

    function showError(message) {
      errorEl.textContent = message || "Request failed.";
      errorEl.classList.remove("d-none");
      successEl.classList.add("d-none");
    }

    function showSuccess(message) {
      successEl.textContent = message || "Saved.";
      successEl.classList.remove("d-none");
      errorEl.classList.add("d-none");
    }

    function clearMessages() {
      errorEl.classList.add("d-none");
      successEl.classList.add("d-none");
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, options);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.message || "Request failed.");
      return data;
    }

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function markdownTextToPreviewHtml(rawText) {
      return escapeHtml(rawText).replace(/\n/g, "<br>");
    }

    function renderMarkdownPreviewHtml(rawMarkdown) {
      const source = String(rawMarkdown || "").replace(/\r\n?/g, "\n");
      if (!source.trim()) {
        return '<div class="note-editor-markdown-preview-empty">Preview trống.</div>';
      }

      const imageRe = /!\[([^\]]*)\]\(([^)\s]+)\)/g;
      const chunks = [];
      let cursor = 0;
      let match;

      while ((match = imageRe.exec(source)) !== null) {
        const before = source.slice(cursor, match.index);
        if (before) {
          chunks.push(`<div class="note-editor-markdown-preview-text">${markdownTextToPreviewHtml(before)}</div>`);
        }

        const alt = String(match[1] || "").trim().slice(0, 160) || "image";
        const imageUrl = String(match[2] || "").trim();
        if (MARKDOWN_PROXY_MEDIA_RE.test(imageUrl)) {
          chunks.push(
            `<figure class="note-editor-markdown-preview-figure"><img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(alt)}" loading="lazy"></figure>`
          );
        } else {
          chunks.push(`<div class="note-editor-markdown-preview-text">${markdownTextToPreviewHtml(match[0])}</div>`);
        }
        cursor = imageRe.lastIndex;
      }

      const tail = source.slice(cursor);
      if (tail) {
        chunks.push(`<div class="note-editor-markdown-preview-text">${markdownTextToPreviewHtml(tail)}</div>`);
      }

      return chunks.length
        ? chunks.join("")
        : '<div class="note-editor-markdown-preview-empty">Preview trống.</div>';
    }

    function bindMarkdownPreview(textarea, previewEl) {
      if (!(textarea instanceof HTMLTextAreaElement) || !(previewEl instanceof HTMLElement)) {
        return;
      }
      const sync = () => {
        previewEl.innerHTML = renderMarkdownPreviewHtml(textarea.value);
      };
      textarea.addEventListener("input", sync);
      sync();
    }

    function renderField(field) {
      const wrapper = document.createElement("div");
      wrapper.className = "mb-3";
      wrapper.setAttribute("data-field-name", field.name);
      wrapper.setAttribute("data-field-type", field.field_type);

      const label = document.createElement("label");
      label.className = "form-label";
      label.textContent = `${field.name}${field.required ? " *" : ""}`;
      wrapper.appendChild(label);

      if (["image", "audio", "diagram"].includes(field.field_type)) {
        const fileInput = document.createElement("input");
        fileInput.type = "file";
        fileInput.className = "form-control";
        wrapper.appendChild(fileInput);
      } else if (field.field_type === "richtext" || field.field_type === "markdown") {
        const textarea = document.createElement("textarea");
        textarea.className = "form-control";
        textarea.rows = field.field_type === "markdown" ? 7 : 4;
        if (field.field_type === "markdown") {
          textarea.setAttribute("data-markdown-editor", "1");
        }
        wrapper.appendChild(textarea);
        if (field.field_type === "markdown") {
          const hint = document.createElement("div");
          hint.className = "note-editor-markdown-hint";
          hint.textContent = "Markdown preview: ảnh /media/proxy sẽ hiển thị ngay bên dưới.";
          wrapper.appendChild(hint);

          const preview = document.createElement("div");
          preview.className = "note-editor-markdown-preview";
          wrapper.appendChild(preview);
          bindMarkdownPreview(textarea, preview);
        }
      } else {
        const input = document.createElement("input");
        input.type = "text";
        input.className = "form-control";
        wrapper.appendChild(input);
      }
      return wrapper;
    }

    async function loadFields(noteTypeId) {
      if (!noteTypeId) {
        dynamicFields.innerHTML = "";
        currentFields = [];
        return;
      }
      const data = await requestJson(`/api/note-types/${noteTypeId}/fields`);
      currentFields = data.items || [];
      dynamicFields.innerHTML = "";
      currentFields.forEach((field) => dynamicFields.appendChild(renderField(field)));
    }

    async function uploadMedia(noteId, fieldName, file) {
      const formData = new FormData();
      formData.append("field_name", fieldName);
      formData.append("file", file);
      const response = await fetch(`/api/notes/${noteId}/media`, {
        method: "POST",
        body: formData,
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.message || `Upload failed for ${fieldName}`);
      return data;
    }

    form?.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearMessages();
      const noteTypeId = noteTypeSelect.value;
      if (!noteTypeId) {
        showError("Please select a note type.");
        return;
      }

      const fieldValues = {};
      const mediaUploads = [];
      for (const field of currentFields) {
        const wrapper = dynamicFields.querySelector(`[data-field-name="${field.name}"]`);
        if (!wrapper) continue;
        if (["image", "audio", "diagram"].includes(field.field_type)) {
          const file = wrapper.querySelector("input[type='file']")?.files?.[0];
          if (file) mediaUploads.push({ fieldName: field.name, file });
          else fieldValues[field.name] = "";
        } else {
          const control = wrapper.querySelector("input, textarea");
          const rawValue = control?.value || "";
          fieldValues[field.name] = field.field_type === "markdown" ? rawValue : rawValue.trim();
        }
      }

      try {
        const created = await requestJson("/api/notes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            note_type_id: noteTypeId,
            deck_id: deckSelect.value || null,
            tags: (tagsInput.value || "").split(",").map((x) => x.trim()).filter(Boolean),
            field_values: fieldValues,
          }),
        });

        for (const upload of mediaUploads) {
          await uploadMedia(created.id, upload.fieldName, upload.file);
        }
        showSuccess(`Saved note ${created.id}`);
      } catch (error) {
        showError(error.message);
      }
    });

    noteTypeSelect?.addEventListener("change", () => {
      clearMessages();
      loadFields(noteTypeSelect.value).catch((error) => showError(error.message));
    });

    if (noteTypeSelect?.value) {
      loadFields(noteTypeSelect.value).catch((error) => showError(error.message));
    }
  })();
</script>
{% endblock %}
