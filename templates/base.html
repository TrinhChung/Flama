<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Nihongo{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    {# Component Styles #}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/forms.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/buttons.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/deck.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/modals.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/navbar.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}" />
  </head>
  <body>
    {# Navbar Component #}
    {% include 'components/navbar.html' %}

    <main class="container">
      {# Alerts Component #}
      {% include 'components/alerts.html' %}

      {% block content %}{% endblock %}
    </main>

    {# Bootstrap JS #}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    {# Component Scripts #}
    <script src="{{ url_for('static', filename='js/components/forms.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/modals.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/deck.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    {% block scripts %}{% endblock %}
  </body>
</html>
