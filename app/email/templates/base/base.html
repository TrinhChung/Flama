<!DOCTYPE html>
<html lang="{{ locale|default('vi') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{ subject|default('Flama') }}</title>
  <!--[if mso]>
  <style type="text/css">
    body, table, td, a { font-family: Arial, Helvetica, sans-serif !important; }
  </style>
  <![endif]-->
  <style type="text/css">
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      min-width: 100% !important;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #1e293b;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      width: 100%;
      table-layout: fixed;
      background-color: #f8fafc;
      padding: 40px 16px;
    }
    .email-container {
      max-width: 580px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 16px;
      border: 1px solid #fed7aa;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(234, 88, 12, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }
    .top-accent {
      height: 5px;
      width: 100%;
      background: #ea580c;
      background: linear-gradient(90deg, #ea580c 0%, #f97316 50%, #f59e0b 100%);
    }
    .header {
      padding: 32px 36px 24px;
      text-align: left;
      background-color: #ffffff;
      border-bottom: 1px solid #f8fafc;
    }
    .brand-badge {
      display: inline-block;
      background: #fff7ed;
      border: 1px solid #ffedd5;
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 12px;
      font-size: 11px;
      font-weight: 700;
      color: #ea580c;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .brand-title {
      font-size: 26px;
      font-weight: 900;
      color: #ea580c;
      letter-spacing: -0.5px;
      margin: 0;
      line-height: 1.2;
    }
    .brand-slogan {
      font-size: 13px;
      color: #9a3412;
      margin: 4px 0 0;
      font-weight: 500;
    }
    .content {
      padding: 32px 36px 36px;
      font-size: 15px;
      line-height: 1.65;
      color: #334155;
      background-color: #ffffff;
    }
    .button-container {
      margin: 30px 0;
      text-align: center;
    }
    .btn-primary {
      display: inline-block;
      background: #ea580c;
      background: linear-gradient(135deg, #ea580c 0%, #f97316 100%);
      color: #ffffff !important;
      text-decoration: none;
      padding: 14px 34px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.35);
    }
    .callout-box {
      border-radius: 10px;
      padding: 16px 20px;
      margin: 24px 0;
      font-size: 14px;
      line-height: 1.6;
    }
    .callout-warning {
      background-color: #fff1f2;
      border-left: 4px solid #f43f5e;
      color: #9f1239;
    }
    .callout-info {
      background-color: #fff7ed;
      border-left: 4px solid #ea580c;
      color: #9a3412;
    }
    .callout-success {
      background-color: #ecfdf5;
      border-left: 4px solid #10b981;
      color: #065f46;
    }
    .fallback-url {
      word-break: break-all;
      font-size: 13px;
      color: #64748b;
      background-color: #f8fafc;
      border: 1px dashed #cbd5e1;
      padding: 12px 14px;
      border-radius: 8px;
      margin-top: 10px;
    }
    .fallback-url a {
      color: #ea580c;
      text-decoration: underline;
    }
    .footer {
      padding: 28px 36px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      line-height: 1.6;
      background-color: #fafaf9;
      border-top: 1px solid #f1f5f9;
    }
    .footer a {
      color: #ea580c;
      text-decoration: none;
      font-weight: 600;
    }
    .footer a:hover {
      text-decoration: underline;
    }
    @media screen and (max-width: 600px) {
      .wrapper { padding: 16px 8px !important; }
      .header, .content, .footer { padding: 24px 20px !important; }
      .brand-title { font-size: 22px !important; }
      .btn-primary { width: 100% !important; box-sizing: border-box !important; padding: 14px 20px !important; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="email-container">
      <div class="top-accent"></div>
      <div class="header">
        <div class="brand-badge">🔥 Nền tảng học tập Flama</div>
        <h1 class="brand-title">Flama</h1>
        <p class="brand-slogan">Giữ ngọn lửa học tập cho mọi kiến thức</p>
      </div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
      <div class="footer">
        <p style="margin: 0 0 6px; font-weight: 600; color: #64748b;">© Flama Study Platform • Spaced Repetition</p>
        <p style="margin: 0 0 8px;">Email này được gửi tự động từ hệ thống Flama.</p>
        {% if support_email %}
        <p style="margin: 0;">Cần hỗ trợ? Liên hệ ban quản trị: <a href="mailto:{{ support_email }}">{{ support_email }}</a></p>
        {% endif %}
      </div>
    </div>
  </div>
</body>
</html>
