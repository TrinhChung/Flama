name: Deploy Flama Backend to Hostinger VPS

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'frontend/**'
  workflow_dispatch:

concurrency:
  group: flama-hostinger-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: Flama
    timeout-minutes: 15

    env:
      PROJECT_DIR: /opt/flama
      RELEASE_ID: ${{ github.sha }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build managed environment payload
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PAYOS_API_KEY: ${{ secrets.PAYOS_API_KEY }}
          PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY }}
          PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          FLASK_APP: ${{ vars.FLASK_APP }}
          DB_PORT: ${{ vars.DB_PORT }}
          FLASHCARDS_SHARE_CUTOVER_FAIL_ON_MISMATCH: ${{ vars.FLASHCARDS_SHARE_CUTOVER_FAIL_ON_MISMATCH }}
          FLASHCARD_MEDIA_MAX_BYTES: ${{ vars.FLASHCARD_MEDIA_MAX_BYTES }}
          FLASHCARD_MEDIA_SCAN_ENABLED: ${{ vars.FLASHCARD_MEDIA_SCAN_ENABLED }}
          PAYMENTS_ENABLED: ${{ vars.PAYMENTS_ENABLED }}
          PAYMENTS_PAID_INSTALL_REQUIRED: ${{ vars.PAYMENTS_PAID_INSTALL_REQUIRED }}
          PAYMENTS_PROVIDER: ${{ vars.PAYMENTS_PROVIDER }}
        run: |
          set -Eeuo pipefail
          managed_env_payload="$RUNNER_TEMP/flama-managed-${RELEASE_ID}.json"
          python deploy/sync_managed_env.py build --output "$managed_env_payload"
          echo "MANAGED_ENV_PAYLOAD=$managed_env_payload" >> "$GITHUB_ENV"

      - name: Build release archive
        run: |
          set -Eeuo pipefail
          release_tar="/tmp/flama-${RELEASE_ID}.tar"
          git archive --format=tar --output="$release_tar" HEAD \
            -- . ':(exclude)frontend'
          gzip "$release_tar"

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts

      - name: Upload release and managed environment payload
        run: |
          set -Eeuo pipefail
          scp -P "$SSH_PORT" \
            "/tmp/flama-${RELEASE_ID}.tar.gz" \
            "$SSH_USER@$SSH_HOST:/tmp/flama-${RELEASE_ID}.tar.gz"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "umask 077; cat > '/tmp/flama-${RELEASE_ID}.env.json'" \
            < "$MANAGED_ENV_PAYLOAD"

      - name: Activate release
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "PROJECT_DIR='$PROJECT_DIR' RELEASE_ID='$RELEASE_ID' bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          release_dir="$PROJECT_DIR/releases/$RELEASE_ID"
          archive_path="/tmp/flama-$RELEASE_ID.tar.gz"
          environment_file=/etc/flama/flama.env
          desired_environment_file="/etc/flama/.flama.env.$RELEASE_ID"
          environment_backup_file="/etc/flama/.flama.env.rollback.$RELEASE_ID"
          managed_env_payload_path="/tmp/flama-$RELEASE_ID.env.json"
          previous_release=""
          activation_started=0
          deployment_succeeded=0

          rollback_activation() {
            if [ "$activation_started" -ne 1 ] || [ "$deployment_succeeded" -eq 1 ]; then
              return
            fi

            echo "Deployment failed after activation; restoring the previous release." >&2
            if [ -f "$environment_backup_file" ]; then
              cp -p "$environment_backup_file" "$environment_file"
            fi

            if [ -n "$previous_release" ] && [ -d "$previous_release" ]; then
              if [ -f "$previous_release/deploy/flama.service" ]; then
                install -m 0644 \
                  "$previous_release/deploy/flama.service" \
                  /etc/systemd/system/flama.service
              fi
              ln -sfn "$previous_release" "$PROJECT_DIR/current"
              systemctl daemon-reload || true
              systemctl restart flama.service || true

              for attempt in $(seq 1 10); do
                if curl --silent --show-error --max-time 5 \
                  http://127.0.0.1:4789/ >/dev/null; then
                  echo "Previous release restored: $previous_release" >&2
                  return
                fi
                sleep 2
              done

              echo "Previous release was selected but did not become healthy." >&2
              return
            fi

            systemctl stop flama.service || true
            echo "No previous release was available; stopped flama.service." >&2
          }

          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              rollback_activation
            fi
            rm -f \
              "$archive_path" \
              "$managed_env_payload_path" \
              "$desired_environment_file" \
              "$environment_backup_file"
            exit "$status"
          }
          trap cleanup EXIT

          test -f "$environment_file"
          test -f "$managed_env_payload_path"
          mkdir -p "$release_dir"
          tar -xzf "$archive_path" -C "$release_dir"
          cp -p "$environment_file" "$desired_environment_file"
          python3 "$release_dir/deploy/sync_managed_env.py" apply \
            --env-file "$desired_environment_file" \
            --payload-file "$managed_env_payload_path"
          FLAMA_ENVIRONMENT_FILE="$desired_environment_file" \
            bash "$release_dir/deploy/bootstrap_hostinger.sh"

          if [ ! -x "$PROJECT_DIR/venv/bin/python" ]; then
            python3 -m venv "$PROJECT_DIR/venv"
          fi

          "$PROJECT_DIR/venv/bin/pip" install --disable-pip-version-check -r "$release_dir/requirements.txt"
          systemd-run --quiet --wait --collect --pipe \
            --unit="flama-db-migrate-$RELEASE_ID" \
            --property=User=flama \
            --property=Group=flama \
            --property="WorkingDirectory=$release_dir" \
            --property="EnvironmentFile=$desired_environment_file" \
            "$PROJECT_DIR/venv/bin/flask" --app wsgi.py db upgrade
          systemd-run --quiet --wait --collect --pipe \
            --unit="flama-bootstrap-admin-$RELEASE_ID" \
            --property=User=flama \
            --property=Group=flama \
            --property="WorkingDirectory=$release_dir" \
            --property="EnvironmentFile=$desired_environment_file" \
            "$PROJECT_DIR/venv/bin/flask" --app wsgi.py bootstrap-admin-sync
          systemd-run --quiet --wait --collect --pipe \
            --unit="flama-seed-data-$RELEASE_ID" \
            --property=User=flama \
            --property=Group=flama \
            --property="WorkingDirectory=$release_dir" \
            --property="EnvironmentFile=$desired_environment_file" \
            "$PROJECT_DIR/venv/bin/flask" --app wsgi.py seed-data-ensure \
              --path static/seed_data
          install -m 0644 "$release_dir/deploy/flama.service" /etc/systemd/system/flama.service

          previous_release="$(readlink -f "$PROJECT_DIR/current" 2>/dev/null || true)"
          case "$previous_release" in
            "$PROJECT_DIR"/releases/*)
              if [ ! -d "$previous_release" ]; then
                previous_release=""
              fi
              ;;
            *)
              previous_release=""
              ;;
          esac

          cp -p "$environment_file" "$environment_backup_file"
          cp -p "$environment_file" /etc/flama/flama.env.bak
          activation_started=1
          mv -f "$desired_environment_file" "$environment_file"
          ln -sfn "$release_dir" "$PROJECT_DIR/current"

          systemctl daemon-reload
          systemctl enable flama.service
          systemctl restart flama.service

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:4789/api/health >/dev/null; then
              touch "$release_dir/.deployment_succeeded"
              deployment_succeeded=1
              python3 "$release_dir/deploy/prune_releases.py" \
                --releases-dir "$PROJECT_DIR/releases" \
                --current-release "$release_dir" \
                --keep 2 || echo "Warning: failed to prune old releases." >&2
              systemctl --no-pager --full status flama.service || true
              exit 0
            fi
            sleep 3
          done

          systemctl --no-pager --full status flama.service || true
          journalctl -u flama.service -n 100 --no-pager || true
          exit 1
          REMOTE_SCRIPT

      - name: Remove local managed environment payload
        if: always()
        run: |
          if [ -n "${MANAGED_ENV_PAYLOAD:-}" ]; then
            rm -f -- "$MANAGED_ENV_PAYLOAD"
          fi
