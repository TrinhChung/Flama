name: Deploy Flama to Hostinger VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: flama-hostinger-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: Flama
    timeout-minutes: 15

    env:
      PROJECT_DIR: /opt/flama
      RELEASE_ID: ${{ github.sha }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build managed environment payload
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          PAYOS_API_KEY: ${{ secrets.PAYOS_API_KEY }}
          PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY }}
          PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID }}
          FLASK_APP: ${{ vars.FLASK_APP }}
          DB_PORT: ${{ vars.DB_PORT }}
          FLASHCARDS_SHARE_CUTOVER_FAIL_ON_MISMATCH: ${{ vars.FLASHCARDS_SHARE_CUTOVER_FAIL_ON_MISMATCH }}
          FLASHCARD_MEDIA_MAX_BYTES: ${{ vars.FLASHCARD_MEDIA_MAX_BYTES }}
          FLASHCARD_MEDIA_SCAN_ENABLED: ${{ vars.FLASHCARD_MEDIA_SCAN_ENABLED }}
          PAYMENTS_ENABLED: ${{ vars.PAYMENTS_ENABLED }}
          PAYMENTS_PAID_INSTALL_REQUIRED: ${{ vars.PAYMENTS_PAID_INSTALL_REQUIRED }}
          PAYMENTS_PROVIDER: ${{ vars.PAYMENTS_PROVIDER }}
        run: |
          set -Eeuo pipefail
          managed_env_payload="$RUNNER_TEMP/flama-managed-${RELEASE_ID}.json"
          python deploy/sync_managed_env.py build --output "$managed_env_payload"
          echo "MANAGED_ENV_PAYLOAD=$managed_env_payload" >> "$GITHUB_ENV"

      - name: Build release archive
        run: git archive --format=tar.gz --output="/tmp/flama-${RELEASE_ID}.tar.gz" HEAD

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts

      - name: Upload release and managed environment payload
        run: |
          set -Eeuo pipefail
          scp -P "$SSH_PORT" \
            "/tmp/flama-${RELEASE_ID}.tar.gz" \
            "$SSH_USER@$SSH_HOST:/tmp/flama-${RELEASE_ID}.tar.gz"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "umask 077; cat > '/tmp/flama-${RELEASE_ID}.env.json'" \
            < "$MANAGED_ENV_PAYLOAD"

      - name: Activate release
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "PROJECT_DIR='$PROJECT_DIR' RELEASE_ID='$RELEASE_ID' bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          release_dir="$PROJECT_DIR/releases/$RELEASE_ID"
          archive_path="/tmp/flama-$RELEASE_ID.tar.gz"
          environment_file=/etc/flama/flama.env
          managed_env_payload_path="/tmp/flama-$RELEASE_ID.env.json"
          trap 'rm -f "$archive_path" "$managed_env_payload_path"' EXIT

          test -f "$environment_file"
          test -f "$managed_env_payload_path"
          mkdir -p "$release_dir"
          tar -xzf "$archive_path" -C "$release_dir"
          python3 "$release_dir/deploy/sync_managed_env.py" apply \
            --env-file "$environment_file" \
            --payload-file "$managed_env_payload_path"

          if [ ! -x "$PROJECT_DIR/venv/bin/python" ]; then
            python3 -m venv "$PROJECT_DIR/venv"
          fi

          "$PROJECT_DIR/venv/bin/pip" install --disable-pip-version-check -r "$release_dir/requirements.txt"
          install -m 0644 "$release_dir/deploy/flama.service" /etc/systemd/system/flama.service
          ln -sfn "$release_dir" "$PROJECT_DIR/current"

          systemctl daemon-reload
          systemctl restart flama.service

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:4789/ >/dev/null; then
              touch "$release_dir/.deployment_succeeded"
              python3 "$release_dir/deploy/prune_releases.py" \
                --releases-dir "$PROJECT_DIR/releases" \
                --current-release "$release_dir" \
                --keep 2
              systemctl --no-pager --full status flama.service
              exit 0
            fi
            sleep 3
          done

          systemctl --no-pager --full status flama.service || true
          journalctl -u flama.service -n 100 --no-pager || true
          exit 1
          REMOTE_SCRIPT

      - name: Remove local managed environment payload
        if: always()
        run: |
          if [ -n "${MANAGED_ENV_PAYLOAD:-}" ]; then
            rm -f -- "$MANAGED_ENV_PAYLOAD"
          fi
