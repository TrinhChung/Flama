name: Deploy Flama Backend to Hostinger VPS

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: flama-hostinger-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: Flama
    timeout-minutes: 35

    env:
      PROJECT_DIR: /opt/flama
      RELEASE_ID: ${{ github.sha }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node for the MCP UI resource
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build the self-contained MCP UI resource
        working-directory: frontend
        run: |
          npm ci
          npm run build:mcp

      - name: Build managed environment payload
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PAYOS_API_KEY: ${{ secrets.PAYOS_API_KEY }}
          PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY }}
          PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_RESEND_API_KEY: ${{ secrets.EMAIL_RESEND_API_KEY }}
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || 'true' }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'smtp' }}
          EMAIL_ENVIRONMENT: ${{ vars.EMAIL_ENVIRONMENT || 'production' }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME || 'Flama' }}
          EMAIL_SMTP_HOST: ${{ vars.EMAIL_SMTP_HOST || 'smtp.gmail.com' }}
          EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT || '587' }}
          EMAIL_SMTP_USER: ${{ vars.EMAIL_SMTP_USER }}
          EMAIL_SMTP_USE_TLS: ${{ vars.EMAIL_SMTP_USE_TLS || 'true' }}
          EMAIL_SMTP_USE_SSL: ${{ vars.EMAIL_SMTP_USE_SSL || 'false' }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || vars.FRONTEND_URL || 'https://flama.vn' }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://flama.vn' }}
          TRUST_PROXY: ${{ vars.TRUST_PROXY || '1' }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID || secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ vars.GOOGLE_OAUTH_REDIRECT_URI || 'https://api.flama.vn/auth/google/callback' }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS || 'https://flama.vn' }}
          CONNECT_CORS_ALLOWED_ORIGINS: ${{ vars.CONNECT_CORS_ALLOWED_ORIGINS || '*' }}
          FLASK_APP: ${{ vars.FLASK_APP || 'wsgi.py' }}
          DB_PORT: ${{ vars.DB_PORT || '3306' }}
          DB_POOL_SIZE: ${{ vars.DB_POOL_SIZE || '4' }}
          DB_MAX_OVERFLOW: ${{ vars.DB_MAX_OVERFLOW || '1' }}
          DB_POOL_TIMEOUT_SECONDS: ${{ vars.DB_POOL_TIMEOUT_SECONDS || '5' }}
          DB_POOL_RECYCLE_SECONDS: ${{ vars.DB_POOL_RECYCLE_SECONDS || '1800' }}
          REVIEW_ANALYTICS_WRITE_ENABLED: ${{ vars.REVIEW_ANALYTICS_WRITE_ENABLED }}
          NOTE_PUBLISHED_BASE_ENABLED: ${{ vars.NOTE_PUBLISHED_BASE_ENABLED }}
          REVIEW_ANALYTICS_READ_MODE: ${{ vars.REVIEW_ANALYTICS_READ_MODE }}
          REVIEW_ANALYTICS_READ_USER_IDS: ${{ vars.REVIEW_ANALYTICS_READ_USER_IDS }}
          REVIEW_ANALYTICS_SHADOW_SAMPLE_RATE: ${{ vars.REVIEW_ANALYTICS_SHADOW_SAMPLE_RATE }}
          REVIEW_ANALYTICS_TIMEZONE_RULES_VERSION: ${{ vars.REVIEW_ANALYTICS_TIMEZONE_RULES_VERSION }}
          DECK_COUNT_WRITE_ENABLED: ${{ vars.DECK_COUNT_WRITE_ENABLED }}
          DECK_COUNT_READ_MODE: ${{ vars.DECK_COUNT_READ_MODE }}
          DECK_COUNT_PREWARM_USER_IDS: ${{ vars.DECK_COUNT_PREWARM_USER_IDS }}
          FORECAST_SUMMARY_READ_MODE: ${{ vars.FORECAST_SUMMARY_READ_MODE }}
          FORECAST_SUMMARY_READ_USER_IDS: ${{ vars.FORECAST_SUMMARY_READ_USER_IDS }}
          ANALYTICS_REQUIRE_READY_USER_IDS: ${{ vars.ANALYTICS_REQUIRE_READY_USER_IDS }}
          FLASHCARDS_SHARE_CUTOVER_FAIL_ON_MISMATCH: ${{ vars.FLASHCARDS_SHARE_CUTOVER_FAIL_ON_MISMATCH || '0' }}
          FLASHCARD_MEDIA_MAX_BYTES: ${{ vars.FLASHCARD_MEDIA_MAX_BYTES || '10485760' }}
          FLASHCARD_MEDIA_SCAN_ENABLED: ${{ vars.FLASHCARD_MEDIA_SCAN_ENABLED || '0' }}
          MEDIA_PROXY_USE_XACCEL: ${{ vars.MEDIA_PROXY_USE_XACCEL || 'true' }}
          PAYMENTS_ENABLED: ${{ vars.PAYMENTS_ENABLED || '0' }}
          PAYMENTS_ORDER_EXPIRY_SECONDS: ${{ vars.PAYMENTS_ORDER_EXPIRY_SECONDS || '1800' }}
          PAYMENTS_PAID_INSTALL_REQUIRED: ${{ vars.PAYMENTS_PAID_INSTALL_REQUIRED || '0' }}
          PAYMENTS_PROVIDER: ${{ vars.PAYMENTS_PROVIDER || 'payos' }}
          PAYMENTS_WEBHOOK_AUTO_GRANT_ENABLED: ${{ vars.PAYMENTS_WEBHOOK_AUTO_GRANT_ENABLED || '1' }}
          REDIS_URL: ${{ vars.REDIS_URL || 'redis://127.0.0.1:6379/0' }}
          REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS: ${{ vars.REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS || '1' }}
          REDIS_SOCKET_TIMEOUT_SECONDS: ${{ vars.REDIS_SOCKET_TIMEOUT_SECONDS || '1' }}
          STUDY_QUEUE_NAMESPACE: ${{ vars.STUDY_QUEUE_NAMESPACE || 'flama-production' }}
          STUDY_ASYNC_BATCH_ENABLED: ${{ vars.STUDY_ASYNC_BATCH_ENABLED || '0' }}
          RATE_LIMIT_BACKEND: ${{ vars.RATE_LIMIT_BACKEND || 'redis' }}
          RATE_LIMIT_KEY_PREFIX: ${{ vars.RATE_LIMIT_KEY_PREFIX || 'flama:v1' }}
          RATE_LIMIT_DAILY_ENABLED: ${{ vars.RATE_LIMIT_DAILY_ENABLED || 'true' }}
          RATE_LIMIT_DAILY_TIMEZONE: ${{ vars.RATE_LIMIT_DAILY_TIMEZONE || 'Asia/Ho_Chi_Minh' }}
          LOGIN_RATE_LIMIT_ENABLED: ${{ vars.LOGIN_RATE_LIMIT_ENABLED || 'true' }}
          LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${{ vars.LOGIN_RATE_LIMIT_WINDOW_SECONDS || '60' }}
          LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${{ vars.LOGIN_RATE_LIMIT_MAX_ATTEMPTS || '5' }}
          LOGIN_RATE_LIMIT_LOCKOUT_SECONDS: ${{ vars.LOGIN_RATE_LIMIT_LOCKOUT_SECONDS || '300' }}
          MCP_TOKEN_RATE_LIMIT_ENABLED: ${{ vars.MCP_TOKEN_RATE_LIMIT_ENABLED || 'false' }}
          MCP_TOKEN_RATE_LIMIT_WINDOW_SECONDS: ${{ vars.MCP_TOKEN_RATE_LIMIT_WINDOW_SECONDS || '60' }}
          MCP_TOKEN_RATE_LIMIT_MAX_REQUESTS: ${{ vars.MCP_TOKEN_RATE_LIMIT_MAX_REQUESTS || '100000' }}
          MCP_PREVIEW_BACKEND: ${{ vars.MCP_PREVIEW_BACKEND || 'redis' }}
          MCP_PREVIEW_TTL_SECONDS: ${{ vars.MCP_PREVIEW_TTL_SECONDS || '600' }}
          MCP_TEMPLATE_PREVIEW_UI_ENABLED: ${{ vars.MCP_TEMPLATE_PREVIEW_UI_ENABLED || 'false' }}
          MCP_TEMPLATE_PREVIEW_MEDIA_BASE_URL: ${{ vars.MCP_TEMPLATE_PREVIEW_MEDIA_BASE_URL || 'https://api.flama.vn' }}
          OAUTH_ISSUER_URL: ${{ vars.OAUTH_ISSUER_URL || 'https://api.flama.vn' }}
          OPENAI_APPS_CHALLENGE_TOKEN: ${{ vars.OPENAI_APPS_CHALLENGE_TOKEN }}
          SHARED_DECK_TREE_CLONE_MODE: ${{ vars.SHARED_DECK_TREE_CLONE_MODE || 'batched' }}
          DECK_SOURCE_NOTETYPE_GUARD_MODE: ${{ vars.DECK_SOURCE_NOTETYPE_GUARD_MODE || 'shadow' }}
          MARKETPLACE_SAMPLE_MODE: ${{ vars.MARKETPLACE_SAMPLE_MODE || 'shadow_cache' }}
          FLASHCARD_RENDER_PREVIEW_CACHE_MAX_ENTRIES: ${{ vars.FLASHCARD_RENDER_PREVIEW_CACHE_MAX_ENTRIES || '512' }}
        run: |
          set -Eeuo pipefail
          managed_env_payload="$RUNNER_TEMP/flama-managed-${RELEASE_ID}.json"
          python deploy/sync_managed_env.py build --output "$managed_env_payload"
          echo "MANAGED_ENV_PAYLOAD=$managed_env_payload" >> "$GITHUB_ENV"

      - name: Build release archive
        run: |
          set -Eeuo pipefail
          release_tar="/tmp/flama-${RELEASE_ID}.tar"
          git archive --format=tar --output="$release_tar" HEAD \
            -- . ':(exclude)frontend'
          tar --append --file="$release_tar" frontend/dist-mcp/index.html
          gzip "$release_tar"

      - name: Record runner network diagnostics
        continue-on-error: true
        run: |
          set -uo pipefail

          diagnostic_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          runner_ip="$(
            curl --fail --silent --show-error --max-time 10 \
              https://api.ipify.org 2>/dev/null || true
          )"
          if python - "$runner_ip" <<'PY'
          import ipaddress
          import sys

          try:
              ipaddress.ip_address(sys.argv[1])
          except ValueError:
              raise SystemExit(1)
          PY
          then
            echo "GitHub runner egress IP: $runner_ip"
          else
            runner_ip="unavailable"
            echo "::warning::Could not determine the GitHub runner egress IP."
          fi

          tcp_status="reachable"
          if timeout 10 bash -c \
            'exec 3<>/dev/tcp/"${SSH_HOST}"/"${SSH_PORT}"'; then
            echo "TCP probe to the configured SSH endpoint succeeded."
          else
            probe_exit=$?
            if [ "$probe_exit" -eq 124 ]; then
              tcp_status="timeout"
            else
              tcp_status="failed (exit $probe_exit)"
            fi
            echo "::warning::TCP probe to the configured SSH endpoint returned: $tcp_status."
          fi

          echo "::notice title=Runner network diagnostics::egress_ip=$runner_ip tcp=$tcp_status recorded_at=$diagnostic_time"
          {
            echo "### Deployment network diagnostics"
            echo "- Recorded at: \`$diagnostic_time\`"
            echo "- Runner egress IP: \`$runner_ip\`"
            echo "- TCP probe to SSH endpoint: \`$tcp_status\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail

          echo "Validating SSH deployment configuration..."
          [ -n "$SSH_HOST" ] || {
            echo "::error::SSH_HOST is empty. Configure it in the Flama GitHub Environment."
            exit 1
          }
          [ -n "$SSH_USER" ] || {
            echo "::error::SSH_USER is empty. Configure it in the Flama GitHub Environment."
            exit 1
          }
          [ -n "$SSH_PRIVATE_KEY" ] || {
            echo "::error::SSH_PRIVATE_KEY is empty. Configure it in the Flama GitHub Environment."
            exit 1
          }
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]] || {
            echo "::error::SSH_PORT must be a numeric value between 1 and 65535."
            exit 1
          }
          ssh_port_number=$((10#$SSH_PORT))
          if [ "$ssh_port_number" -lt 1 ] || [ "$ssh_port_number" -gt 65535 ]; then
            echo "::error::SSH_PORT must be between 1 and 65535."
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if ! timeout 5 ssh-keygen -y -f ~/.ssh/id_ed25519 \
            </dev/null >/dev/null; then
            echo "::error::SSH_PRIVATE_KEY is invalid or requires a passphrase."
            exit 1
          fi
          echo "SSH private key format is valid."

          if ! getent ahosts "$SSH_HOST" >/dev/null; then
            echo "::error::SSH_HOST could not be resolved. Use only an IP address or hostname, without a protocol, username, or port."
            exit 1
          fi
          echo "SSH host resolved successfully."

          known_hosts_tmp="$HOME/.ssh/known_hosts.tmp"
          trap 'rm -f -- "$known_hosts_tmp"' EXIT
          for attempt in 1 2 3; do
            echo "Testing authenticated SSH connection (attempt $attempt/3, timeout 15s)..."
            if ssh \
              -p "$SSH_PORT" \
              -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ConnectionAttempts=1 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$known_hosts_tmp" \
              "$SSH_USER@$SSH_HOST" true; then
              mv "$known_hosts_tmp" ~/.ssh/known_hosts
              chmod 600 ~/.ssh/known_hosts
              echo "Authenticated SSH connection succeeded. Host key fingerprint:"
              ssh-keygen -lf ~/.ssh/known_hosts
              exit 0
            fi
            echo "::warning::Authenticated SSH connection failed on attempt $attempt. See the SSH error above."
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done

          echo "::error::Unable to establish an authenticated SSH connection. Check the SSH error above to distinguish network, host-key, and authentication failures."
          exit 1

      - name: Upload release and managed environment payload
        run: |
          set -Eeuo pipefail
          scp -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -P "$SSH_PORT" \
            "/tmp/flama-${RELEASE_ID}.tar.gz" \
            "$SSH_USER@$SSH_HOST:/tmp/flama-${RELEASE_ID}.tar.gz"
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "umask 077; cat > '/tmp/flama-${RELEASE_ID}.env.json'" \
            < "$MANAGED_ENV_PAYLOAD"

      - name: Activate release under a durable VPS coordinator
        env:
          DEPLOYMENT_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash deploy/run_remote_deploy.sh

      - name: Remove local managed environment payload
        if: always()
        run: |
          if [ -n "${MANAGED_ENV_PAYLOAD:-}" ]; then
            rm -f -- "$MANAGED_ENV_PAYLOAD"
          fi
