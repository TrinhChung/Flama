name: Deploy Flama to VPS

on:
  push:
    branches:
      - master # Đã sửa thành nhánh master cho project Flama

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Flama # Đã đổi tên environment
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to VPS
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          # Thêm biến DB_PASSWORD cho Flama lấy từ Github Secrets
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST << 'EOF'
          set -e
          
          # Kiểm tra xem git có được cài đặt không
          if ! command -v git &> /dev/null; then
            echo "Error: Git is not installed on VPS"
            echo "Please install Git manually: sudo apt-get install -y git"
            exit 1
          fi
          
          # Kiểm tra xem docker-compose có được cài đặt không
          if ! command -v docker &> /dev/null; then
            echo "Docker not found, please install Docker first."
            exit 1
          fi
          
          # Di chuyển đến thư mục dự án hoặc tạo mới nếu chưa có
          PROJECT_DIR="/home/$SSH_USER/flama-app"
          if [ ! -d "$PROJECT_DIR" ]; then
            mkdir -p "$PROJECT_DIR"
            cd "$PROJECT_DIR"
            git clone https://github.com/${{ github.repository }}.git .
          else
            cd "$PROJECT_DIR"
            git fetch origin
            git reset --hard origin/master
          fi
          
          # Bổ sung các biến môi trường cấu hình Database thay thế .env_example của project Flama
          if [ ! -f .env ]; then
            echo "Creating .env file..."
            cat > .env << ENVEOF
          FLASK_APP=wsgi.py
          FLASK_ENV=production
          SECRET_KEY=$(openssl rand -hex 32)
          DB_HOST=localhost
          DB_PORT=3306
          DB_USER=root
          DB_PASSWORD=${DB_PASSWORD:-"your-db-password"}
          DB_NAME=flama
          USE_NEW_CARD_MODEL=true
          FLASHCARD_MEDIA_MAX_BYTES=10485760
          ENVEOF
          fi
          
          # Dừng các container cũ nếu có
          docker compose down || true
          
          # Xây dựng và chạy ứng dụng
          docker compose up -d --build
          
          echo "Deployment successful!"
          echo "Application is running on port 4789"
          EOF
