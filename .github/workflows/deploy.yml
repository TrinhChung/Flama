name: Deploy Flama Backend to Hostinger VPS

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: flama-hostinger-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: Flama
    timeout-minutes: 15

    env:
      PROJECT_DIR: /opt/flama
      RELEASE_ID: ${{ github.sha }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build managed environment payload
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          PAYOS_API_KEY: ${{ secrets.PAYOS_API_KEY }}
          PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY }}
          PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_RESEND_API_KEY: ${{ secrets.EMAIL_RESEND_API_KEY }}
          EMAIL_ENABLED: ${{ vars.EMAIL_ENABLED || 'true' }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'smtp' }}
          EMAIL_ENVIRONMENT: ${{ vars.EMAIL_ENVIRONMENT || 'production' }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS || 'chungtrinh2k2@gmail.com' }}
          EMAIL_FROM_NAME: ${{ vars.EMAIL_FROM_NAME || 'Flama' }}
          EMAIL_SMTP_HOST: ${{ vars.EMAIL_SMTP_HOST || 'smtp.gmail.com' }}
          EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT || '587' }}
          EMAIL_SMTP_USER: ${{ vars.EMAIL_SMTP_USER || 'chungtrinh2k2@gmail.com' }}
          EMAIL_SMTP_USE_TLS: ${{ vars.EMAIL_SMTP_USE_TLS || 'true' }}
          EMAIL_SMTP_USE_SSL: ${{ vars.EMAIL_SMTP_USE_SSL || 'false' }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || vars.FRONTEND_URL || 'https://flama.vn' }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://flama.vn' }}
          TRUST_PROXY: ${{ vars.TRUST_PROXY || '1' }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID || secrets.GOOGLE_OAUTH_CLIENT_ID || '992185847654-b1aekjqb7dh3hddetgve8qfps17nro08.apps.googleusercontent.com' }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ vars.GOOGLE_OAUTH_REDIRECT_URI || 'https://api.flama.vn/auth/google/callback' }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS || 'https://flama.vn,https://flama.stmtp.com' }}
          CONNECT_CORS_ALLOWED_ORIGINS: ${{ vars.CONNECT_CORS_ALLOWED_ORIGINS || '*' }}
          FLASK_APP: ${{ vars.FLASK_APP || 'wsgi.py' }}
          DB_PORT: ${{ vars.DB_PORT || '3306' }}
          DB_POOL_SIZE: ${{ vars.DB_POOL_SIZE || '4' }}
          DB_MAX_OVERFLOW: ${{ vars.DB_MAX_OVERFLOW || '1' }}
          DB_POOL_TIMEOUT_SECONDS: ${{ vars.DB_POOL_TIMEOUT_SECONDS || '5' }}
          DB_POOL_RECYCLE_SECONDS: ${{ vars.DB_POOL_RECYCLE_SECONDS || '1800' }}
          FLASHCARDS_SHARE_CUTOVER_FAIL_ON_MISMATCH: ${{ vars.FLASHCARDS_SHARE_CUTOVER_FAIL_ON_MISMATCH || '0' }}
          FLASHCARD_MEDIA_MAX_BYTES: ${{ vars.FLASHCARD_MEDIA_MAX_BYTES || '10485760' }}
          FLASHCARD_MEDIA_SCAN_ENABLED: ${{ vars.FLASHCARD_MEDIA_SCAN_ENABLED || '0' }}
          MEDIA_PROXY_USE_XACCEL: ${{ vars.MEDIA_PROXY_USE_XACCEL || 'true' }}
          PAYMENTS_ENABLED: ${{ vars.PAYMENTS_ENABLED || '0' }}
          PAYMENTS_ORDER_EXPIRY_SECONDS: ${{ vars.PAYMENTS_ORDER_EXPIRY_SECONDS || '1800' }}
          PAYMENTS_PAID_INSTALL_REQUIRED: ${{ vars.PAYMENTS_PAID_INSTALL_REQUIRED || '0' }}
          PAYMENTS_PROVIDER: ${{ vars.PAYMENTS_PROVIDER || 'payos' }}
          PAYMENTS_WEBHOOK_AUTO_GRANT_ENABLED: ${{ vars.PAYMENTS_WEBHOOK_AUTO_GRANT_ENABLED || '1' }}
          REDIS_URL: ${{ vars.REDIS_URL || 'redis://127.0.0.1:6379/0' }}
          REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS: ${{ vars.REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS || '1' }}
          REDIS_SOCKET_TIMEOUT_SECONDS: ${{ vars.REDIS_SOCKET_TIMEOUT_SECONDS || '1' }}
          STUDY_QUEUE_NAMESPACE: ${{ vars.STUDY_QUEUE_NAMESPACE || 'flama-production' }}
          STUDY_ASYNC_BATCH_ENABLED: ${{ vars.STUDY_ASYNC_BATCH_ENABLED || '0' }}
          RATE_LIMIT_BACKEND: ${{ vars.RATE_LIMIT_BACKEND || 'redis' }}
          RATE_LIMIT_KEY_PREFIX: ${{ vars.RATE_LIMIT_KEY_PREFIX || 'flama:v1' }}
          RATE_LIMIT_DAILY_ENABLED: ${{ vars.RATE_LIMIT_DAILY_ENABLED || 'true' }}
          RATE_LIMIT_REGULAR_DAILY_MAX: ${{ vars.RATE_LIMIT_REGULAR_DAILY_MAX || '300' }}
          RATE_LIMIT_CREATOR_DAILY_MAX: ${{ vars.RATE_LIMIT_CREATOR_DAILY_MAX || '2000' }}
          RATE_LIMIT_ENTERPRISE_DAILY_MAX: ${{ vars.RATE_LIMIT_ENTERPRISE_DAILY_MAX || '10000' }}
          RATE_LIMIT_DAILY_TIMEZONE: ${{ vars.RATE_LIMIT_DAILY_TIMEZONE || 'Asia/Ho_Chi_Minh' }}
          LOGIN_RATE_LIMIT_ENABLED: ${{ vars.LOGIN_RATE_LIMIT_ENABLED || 'true' }}
          LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${{ vars.LOGIN_RATE_LIMIT_WINDOW_SECONDS || '60' }}
          LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${{ vars.LOGIN_RATE_LIMIT_MAX_ATTEMPTS || '5' }}
          LOGIN_RATE_LIMIT_LOCKOUT_SECONDS: ${{ vars.LOGIN_RATE_LIMIT_LOCKOUT_SECONDS || '300' }}
          MCP_TOKEN_RATE_LIMIT_ENABLED: ${{ vars.MCP_TOKEN_RATE_LIMIT_ENABLED || 'false' }}
          MCP_TOKEN_RATE_LIMIT_WINDOW_SECONDS: ${{ vars.MCP_TOKEN_RATE_LIMIT_WINDOW_SECONDS || '60' }}
          MCP_TOKEN_RATE_LIMIT_MAX_REQUESTS: ${{ vars.MCP_TOKEN_RATE_LIMIT_MAX_REQUESTS || '100000' }}
          MCP_PREVIEW_BACKEND: ${{ vars.MCP_PREVIEW_BACKEND || 'redis' }}
          MCP_PREVIEW_TTL_SECONDS: ${{ vars.MCP_PREVIEW_TTL_SECONDS || '600' }}
          SHARED_DECK_TREE_CLONE_MODE: ${{ vars.SHARED_DECK_TREE_CLONE_MODE || 'batched' }}
          DECK_SOURCE_NOTETYPE_GUARD_MODE: ${{ vars.DECK_SOURCE_NOTETYPE_GUARD_MODE || 'shadow' }}
          MARKETPLACE_SAMPLE_MODE: ${{ vars.MARKETPLACE_SAMPLE_MODE || 'shadow_cache' }}
          FLASHCARD_RENDER_PREVIEW_CACHE_MAX_ENTRIES: ${{ vars.FLASHCARD_RENDER_PREVIEW_CACHE_MAX_ENTRIES || '512' }}
        run: |
          set -Eeuo pipefail
          managed_env_payload="$RUNNER_TEMP/flama-managed-${RELEASE_ID}.json"
          python deploy/sync_managed_env.py build --output "$managed_env_payload"
          echo "MANAGED_ENV_PAYLOAD=$managed_env_payload" >> "$GITHUB_ENV"

      - name: Build release archive
        run: |
          set -Eeuo pipefail
          release_tar="/tmp/flama-${RELEASE_ID}.tar"
          git archive --format=tar --output="$release_tar" HEAD \
            -- . ':(exclude)frontend'
          gzip "$release_tar"

      - name: Record runner network diagnostics
        continue-on-error: true
        run: |
          set -uo pipefail

          diagnostic_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          runner_ip="$(
            curl --fail --silent --show-error --max-time 10 \
              https://api.ipify.org 2>/dev/null || true
          )"
          if python - "$runner_ip" <<'PY'
          import ipaddress
          import sys

          try:
              ipaddress.ip_address(sys.argv[1])
          except ValueError:
              raise SystemExit(1)
          PY
          then
            echo "GitHub runner egress IP: $runner_ip"
          else
            runner_ip="unavailable"
            echo "::warning::Could not determine the GitHub runner egress IP."
          fi

          tcp_status="reachable"
          if timeout 10 bash -c \
            'exec 3<>/dev/tcp/"${SSH_HOST}"/"${SSH_PORT}"'; then
            echo "TCP probe to the configured SSH endpoint succeeded."
          else
            probe_exit=$?
            if [ "$probe_exit" -eq 124 ]; then
              tcp_status="timeout"
            else
              tcp_status="failed (exit $probe_exit)"
            fi
            echo "::warning::TCP probe to the configured SSH endpoint returned: $tcp_status."
          fi

          echo "::notice title=Runner network diagnostics::egress_ip=$runner_ip tcp=$tcp_status recorded_at=$diagnostic_time"
          {
            echo "### Deployment network diagnostics"
            echo "- Recorded at: \`$diagnostic_time\`"
            echo "- Runner egress IP: \`$runner_ip\`"
            echo "- TCP probe to SSH endpoint: \`$tcp_status\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail

          echo "Validating SSH deployment configuration..."
          [ -n "$SSH_HOST" ] || {
            echo "::error::SSH_HOST is empty. Configure it in the Flama GitHub Environment."
            exit 1
          }
          [ -n "$SSH_USER" ] || {
            echo "::error::SSH_USER is empty. Configure it in the Flama GitHub Environment."
            exit 1
          }
          [ -n "$SSH_PRIVATE_KEY" ] || {
            echo "::error::SSH_PRIVATE_KEY is empty. Configure it in the Flama GitHub Environment."
            exit 1
          }
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]] || {
            echo "::error::SSH_PORT must be a numeric value between 1 and 65535."
            exit 1
          }
          ssh_port_number=$((10#$SSH_PORT))
          if [ "$ssh_port_number" -lt 1 ] || [ "$ssh_port_number" -gt 65535 ]; then
            echo "::error::SSH_PORT must be between 1 and 65535."
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if ! timeout 5 ssh-keygen -y -f ~/.ssh/id_ed25519 \
            </dev/null >/dev/null; then
            echo "::error::SSH_PRIVATE_KEY is invalid or requires a passphrase."
            exit 1
          fi
          echo "SSH private key format is valid."

          if ! getent ahosts "$SSH_HOST" >/dev/null; then
            echo "::error::SSH_HOST could not be resolved. Use only an IP address or hostname, without a protocol, username, or port."
            exit 1
          fi
          echo "SSH host resolved successfully."

          known_hosts_tmp="$HOME/.ssh/known_hosts.tmp"
          trap 'rm -f -- "$known_hosts_tmp"' EXIT
          for attempt in 1 2 3; do
            echo "Testing authenticated SSH connection (attempt $attempt/3, timeout 15s)..."
            if ssh \
              -p "$SSH_PORT" \
              -i ~/.ssh/id_ed25519 \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ConnectionAttempts=1 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$known_hosts_tmp" \
              "$SSH_USER@$SSH_HOST" true; then
              mv "$known_hosts_tmp" ~/.ssh/known_hosts
              chmod 600 ~/.ssh/known_hosts
              echo "Authenticated SSH connection succeeded. Host key fingerprint:"
              ssh-keygen -lf ~/.ssh/known_hosts
              exit 0
            fi
            echo "::warning::Authenticated SSH connection failed on attempt $attempt. See the SSH error above."
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done

          echo "::error::Unable to establish an authenticated SSH connection. Check the SSH error above to distinguish network, host-key, and authentication failures."
          exit 1

      - name: Upload release and managed environment payload
        run: |
          set -Eeuo pipefail
          scp -P "$SSH_PORT" \
            "/tmp/flama-${RELEASE_ID}.tar.gz" \
            "$SSH_USER@$SSH_HOST:/tmp/flama-${RELEASE_ID}.tar.gz"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "umask 077; cat > '/tmp/flama-${RELEASE_ID}.env.json'" \
            < "$MANAGED_ENV_PAYLOAD"

      - name: Activate release
        run: |
          set -Eeuo pipefail
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "PROJECT_DIR='$PROJECT_DIR' RELEASE_ID='$RELEASE_ID' bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          release_dir="$PROJECT_DIR/releases/$RELEASE_ID"
          archive_path="/tmp/flama-$RELEASE_ID.tar.gz"
          environment_file=/etc/flama/flama.env
          desired_environment_file="/etc/flama/.flama.env.$RELEASE_ID"
          environment_backup_file="/etc/flama/.flama.env.rollback.$RELEASE_ID"
          managed_env_payload_path="/tmp/flama-$RELEASE_ID.env.json"
          previous_release=""
          activation_started=0
          deployment_succeeded=0

          rollback_activation() {
            if [ "$activation_started" -ne 1 ] || [ "$deployment_succeeded" -eq 1 ]; then
              return
            fi

            echo "Deployment failed after activation; restoring the previous release." >&2
            # Quiesce request writers before inspecting durable state. Leave the
            # new consumer/environment/release intact if rollback is unsafe, so
            # accepted work can drain and an operator can audit/rollback NOTE.
            if ! systemctl stop flama.service flama-connect.service; then
              echo "Automatic rollback blocked: HTTP/Connect writers did not stop." >&2
              return
            fi
            if ! systemd-run --quiet --wait --collect --pipe \
              --unit="flama-study-rollback-check-$RELEASE_ID" \
              --property=User=flama \
              --property=Group=flama \
              --property="WorkingDirectory=$release_dir" \
              --property="EnvironmentFile=$environment_file" \
              "$PROJECT_DIR/venv/bin/python" study_worker.py --check-code-rollback --writers-quiesced; then
              echo "Automatic rollback blocked: retain this release/consumer and resolve the reported Study gate before restoring code." >&2
              return
            fi
            if ! systemctl stop flama-study-worker.service; then
              echo "Automatic rollback blocked: the Study consumer did not stop." >&2
              return
            fi
            if [ -f "$environment_backup_file" ]; then
              cp -p "$environment_backup_file" "$environment_file"
            fi

            if [ -n "$previous_release" ] && [ -d "$previous_release" ]; then
              previous_connect_available=0
              previous_worker_available=0
              if [ -f "$previous_release/deploy/flama.service" ]; then
                install -m 0644 \
                  "$previous_release/deploy/flama.service" \
                  /etc/systemd/system/flama.service
              fi
              if [ -f "$previous_release/deploy/flama-connect.service" ]; then
                install -m 0644 \
                  "$previous_release/deploy/flama-connect.service" \
                  /etc/systemd/system/flama-connect.service
                previous_connect_available=1
              fi
              if [ -f "$previous_release/deploy/flama-study-worker.service" ]; then
                install -m 0644 \
                  "$previous_release/deploy/flama-study-worker.service" \
                  /etc/systemd/system/flama-study-worker.service
                previous_worker_available=1
              fi
              ln -sfn "$previous_release" "$PROJECT_DIR/current"
              systemctl daemon-reload || true
              if [ "$previous_worker_available" -eq 1 ]; then
                systemctl restart flama-study-worker.service || true
              else
                systemctl disable flama-study-worker.service || true
              fi
              systemctl restart flama.service || true
              if [ "$previous_connect_available" -eq 1 ]; then
                systemctl restart flama-connect.service || true
              else
                systemctl stop flama-connect.service || true
              fi

              for attempt in $(seq 1 10); do
                if curl --silent --show-error --max-time 5 \
                  http://127.0.0.1:4789/ >/dev/null \
                  && { [ "$previous_connect_available" -eq 0 ] \
                    || curl --silent --show-error --max-time 5 \
                      http://127.0.0.1:4790/healthz >/dev/null; }; then
                  echo "Previous release restored: $previous_release" >&2
                  return
                fi
                sleep 2
              done

              echo "Previous release was selected but did not become healthy." >&2
              return
            fi

            systemctl stop flama.service || true
            systemctl stop flama-connect.service || true
            systemctl disable flama-study-worker.service || true
            echo "No previous release was available; stopped flama.service." >&2
          }

          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              rollback_activation
            fi
            rm -f \
              "$archive_path" \
              "$managed_env_payload_path" \
              "$desired_environment_file" \
              "$environment_backup_file"
            exit "$status"
          }
          trap cleanup EXIT

          test -f "$environment_file"
          test -f "$managed_env_payload_path"
          mkdir -p "$release_dir"
          tar -xzf "$archive_path" -C "$release_dir"
          cp -p "$environment_file" "$desired_environment_file"
          python3 "$release_dir/deploy/sync_managed_env.py" apply \
            --env-file "$desired_environment_file" \
            --payload-file "$managed_env_payload_path"
          FLAMA_ENVIRONMENT_FILE="$desired_environment_file" \
            bash "$release_dir/deploy/bootstrap_hostinger.sh"

          mkdir -p /var/lib/flama/downloads
          mkdir -p "$release_dir/static"
          ln -sfn /var/lib/flama/downloads "$release_dir/static/downloads"
          chown -R flama:flama /var/lib/flama/downloads

          if [ ! -x "$PROJECT_DIR/venv/bin/python" ]; then
            python3 -m venv "$PROJECT_DIR/venv"
          fi

          "$PROJECT_DIR/venv/bin/pip" install --disable-pip-version-check -r "$release_dir/requirements.txt"
          systemd-run --quiet --wait --collect --pipe \
            --unit="flama-db-migrate-$RELEASE_ID" \
            --property=User=flama \
            --property=Group=flama \
            --property="WorkingDirectory=$release_dir" \
            --property="EnvironmentFile=$desired_environment_file" \
            "$PROJECT_DIR/venv/bin/flask" --app wsgi.py db upgrade
          systemd-run --quiet --wait --collect --pipe \
            --unit="flama-bootstrap-admin-$RELEASE_ID" \
            --property=User=flama \
            --property=Group=flama \
            --property="WorkingDirectory=$release_dir" \
            --property="EnvironmentFile=$desired_environment_file" \
            "$PROJECT_DIR/venv/bin/flask" --app wsgi.py bootstrap-admin-sync
          install -m 0644 "$release_dir/deploy/flama.service" /etc/systemd/system/flama.service
          install -m 0644 "$release_dir/deploy/flama-connect.service" /etc/systemd/system/flama-connect.service
          install -m 0644 "$release_dir/deploy/flama-study-worker.service" /etc/systemd/system/flama-study-worker.service

          previous_release="$(readlink -f "$PROJECT_DIR/current" 2>/dev/null || true)"
          case "$previous_release" in
            "$PROJECT_DIR"/releases/*)
              if [ ! -d "$previous_release" ]; then
                previous_release=""
              fi
              ;;
            *)
              previous_release=""
              ;;
          esac

          cp -p "$environment_file" "$environment_backup_file"
          cp -p "$environment_file" /etc/flama/flama.env.bak
          # Stop the previous consumer under its original environment before
          # changing the symlink/namespace; DB admissions survive the handoff.
          systemctl daemon-reload
          systemctl stop flama-study-worker.service
          activation_started=1
          mv -f "$desired_environment_file" "$environment_file"
          ln -sfn "$release_dir" "$PROJECT_DIR/current"

          systemctl daemon-reload
          systemctl enable flama.service
          systemctl enable flama-connect.service
          systemctl enable flama-study-worker.service
          systemctl restart flama-study-worker.service
          systemctl restart flama.service
          systemctl restart flama-connect.service

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:4789/api/health >/dev/null \
              && curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:4790/healthz >/dev/null \
              && systemctl is-active --quiet flama-study-worker.service \
              && systemd-run --quiet --wait --collect --pipe \
                --unit="flama-study-ready-$RELEASE_ID-$attempt" \
                --property=User=flama \
                --property=Group=flama \
                --property="WorkingDirectory=$release_dir" \
                --property="EnvironmentFile=$environment_file" \
                "$PROJECT_DIR/venv/bin/python" study_worker.py --check-ready; then
              touch "$release_dir/.deployment_succeeded"
              deployment_succeeded=1
              python3 "$release_dir/deploy/prune_releases.py" \
                --releases-dir "$PROJECT_DIR/releases" \
                --current-release "$release_dir" \
                --keep 2 || echo "Warning: failed to prune old releases." >&2
              systemctl --no-pager --full status flama.service || true
              systemctl --no-pager --full status flama-connect.service || true
              systemctl --no-pager --full status flama-study-worker.service || true
              exit 0
            fi
            sleep 3
          done

          systemctl --no-pager --full status flama.service || true
          systemctl --no-pager --full status flama-connect.service || true
          systemctl --no-pager --full status flama-study-worker.service || true
          journalctl -u flama.service -n 100 --no-pager || true
          journalctl -u flama-connect.service -n 100 --no-pager || true
          journalctl -u flama-study-worker.service -n 100 --no-pager || true
          exit 1
          REMOTE_SCRIPT

      - name: Remove local managed environment payload
        if: always()
        run: |
          if [ -n "${MANAGED_ENV_PAYLOAD:-}" ]; then
            rm -f -- "$MANAGED_ENV_PAYLOAD"
          fi
