name: Secret Scanning

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scanning-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Gitleaks Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Scan tracked files for production IPs, retired secrets and WireGuard hosts
        env:
          # Real values live only in this secret (one per line or comma separated), never in the repo.
          FLAMA_FORBIDDEN_LITERALS: ${{ secrets.FLAMA_FORBIDDEN_LITERALS }}
        run: |
          if [ -z "$FLAMA_FORBIDDEN_LITERALS" ]; then
            echo "::warning::Repository secret FLAMA_FORBIDDEN_LITERALS is not set; real server IPs and retired secrets are not checked."
          fi
          python3 scripts/check_secrets_staged.py --all
