name: CI

env:
  # Pin the complete event range. HEAD~1 misses files when a push contains
  # multiple commits; the modular runner consumes these values directly.
  TEST_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  TEST_DIFF_HEAD: ${{ github.sha }}

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.vscode/**'
      - 'flama-audio/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.vscode/**'
      - 'flama-audio/**'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python for changed-file selection
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # jsdom 30 (used by Vitest) requires Node >= 22.22.2. Pin the
          # compatible patch instead of relying on the runner's cached 22.x.
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: |
          if [ "${{ github.ref_name }}" = "master" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Running full frontend test suite on master..."
            npm test
          else
            echo "Running targeted tests for changed files..."
            python ../scripts/run_tests.py --changed --frontend-only
          fi

      - name: Build
        run: npm run build

      - name: Upload React build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  test:
    needs: frontend
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download React build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        env:
          DB_USER: ci
          DB_NAME: ci
          SECRET_KEY: ci-secret
          REDIS_URL: redis://127.0.0.1:6379/15
        run: |
          if [ "${{ github.ref_name }}" = "master" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Running full backend test suite on master..."
            python scripts/run_tests.py --all --backend-only
          else
            echo "Running modular backend test suite for changed modules..."
            python scripts/run_tests.py --changed --backend-only
          fi
