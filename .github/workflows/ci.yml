name: CI

env:
  # Pin the complete event range. HEAD~1 misses files when a push contains
  # multiple commits; the modular runner consumes these values directly.
  TEST_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  TEST_DIFF_HEAD: ${{ github.sha }}

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.vscode/**'
      - 'flama-audio/**'
  pull_request:
    branches:
      - master
      - develop
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.vscode/**'
      - 'flama-audio/**'
  workflow_dispatch:

permissions:
  contents: read
  deployments: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      spa_contract: ${{ steps.plan.outputs.spa_contract }}
      redis_contract: ${{ steps.plan.outputs.redis_contract }}
      mysql_contract: ${{ steps.plan.outputs.mysql_contract }}
      deploy: ${{ steps.plan.outputs.deploy }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The deploy gate also compares HEAD with the release running in
      # production: a runtime push whose CI failed (#171) must deploy with the
      # next green push, even when that push only changes tests.
      - name: Resolve the release running in production
        id: deployed
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=""
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=Flama&per_page=30" --jq '.[].id' || true); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=1" --jq '.[0].state // ""' || true)
            if [ "$state" = "success" ]; then
              sha=$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}" --jq '.sha' || true)
              break
            fi
          done
          echo "Production release: ${sha:-unknown}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Plan affected validation jobs
        id: plan
        env:
          CI_FORCE_ALL_VALIDATION: ${{ github.event_name != 'pull_request' }}
          DEPLOYED_RELEASE_SHA: ${{ steps.deployed.outputs.sha }}
        run: python scripts/run_tests.py --ci-plan --github-output "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python for changed-file selection
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # jsdom 30 (used by Vitest) requires Node >= 22.22.2. Pin the
          # compatible patch instead of relying on the runner's cached 22.x.
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: |
          if [ "${{ github.ref_name }}" = "master" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Running full frontend test suite on master..."
            npm test
          else
            echo "Running targeted tests for changed files..."
            python ../scripts/run_tests.py --changed --frontend-only
          fi

      - name: Build
        run: npm run build:ci

      - name: Validate Cloudflare deployment configuration
        run: npm run deploy:check

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        env:
          DB_USER: ci
          DB_NAME: ci
          SECRET_KEY: ci-secret
        run: |
          if [ "${{ github.ref_name }}" = "master" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Running full backend test suite on master..."
            python scripts/run_tests.py --all --backend-only
          else
            echo "Running modular backend test suite for changed modules..."
            python scripts/run_tests.py --changed --backend-only
          fi

  spa-contract:
    needs: [changes, frontend]
    if: >-
      needs.changes.outputs.spa_contract == 'true' &&
      needs.frontend.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build the SPA in this job instead of passing an artifact: CI uses no
      # Actions artifact storage, so an exhausted quota cannot block it.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build:ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Flask serves the real Vite artifact
        env:
          DB_USER: ci
          DB_NAME: ci
          SECRET_KEY: ci-secret
          FLAMA_REQUIRE_REAL_SPA_ARTIFACT: '1'
        run: python -m unittest tests.test_spa_artifact_contract

  redis-contract:
    needs: changes
    if: needs.changes.outputs.redis_contract == 'true'
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Redis contract tests
        env:
          DB_USER: ci
          DB_NAME: ci
          SECRET_KEY: ci-secret
          REDIS_URL: redis://127.0.0.1:6379/15
        run: python -m unittest tests.test_shared_state_services

  mysql-contract:
    needs: changes
    if: needs.changes.outputs.mysql_contract == 'true'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ci
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Alembic migrations on MySQL
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: ci-root-password
          DB_NAME: ci
          SECRET_KEY: ci-secret
          STARTUP_RUN_MAINTENANCE: '0'
          STARTUP_RUN_DB_CREATE_ALL: '0'
        run: |
          python scripts/bootstrap_historical_schema.py --database ci --ci-empty-database
          flask --app wsgi.py db upgrade

      - name: Run MySQL locking and concurrency contract
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: ci-root-password
          DB_NAME: ci
        run: python scripts/probe_p1_02_mysql_concurrency.py

      - name: Run NOTE analytics read-only contract on MySQL
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: ci-root-password
          DB_NAME: ci
        run: python scripts/probe_p5_analytics_mysql.py

      - name: Verify historical and deck count transactions on MySQL
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: ci-root-password
          DB_NAME: ci
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from sqlalchemy.engine import URL
          from app import create_audit_app
          from models import db
          from models.user import User
          from app.services.study_authority_enrollment_service import enroll_new_learner_note_authority
          url = URL.create('mysql+pymysql', username=os.environ['DB_USER'], password=os.environ['DB_PASSWORD'], host=os.environ['DB_HOST'], port=int(os.environ['DB_PORT']), database=os.environ['DB_NAME'], query={'charset':'utf8mb4'})
          assert url.database == 'ci' and url.host == '127.0.0.1'
          app = create_audit_app({'SQLALCHEMY_DATABASE_URI':url.render_as_string(hide_password=False)})
          with app.app_context():
              if db.session.get(User, 1) is None:
                  anchor = User(id=1, username='ci-analytics-anchor', email='ci-analytics-anchor@example.invalid', timezone='UTC')
                  db.session.add(anchor)
                  db.session.flush()
                  enroll_new_learner_note_authority(db.session, user=anchor)
                  db.session.commit()
          path = Path('output/analytics-counts-ci.env')
          path.parent.mkdir(exist_ok=True)
          path.write_text('SQLALCHEMY_DATABASE_URI=' + url.render_as_string(hide_password=False) + '\n', encoding='utf-8')
          PY
          python scripts/probe_review_analytics_mysql.py --env-file output/analytics-counts-ci.env
          python scripts/probe_deck_counts_mysql.py --env-file output/analytics-counts-ci.env

      - name: Run cross-learner NOTE write concurrency contract on MySQL
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: ci-root-password
          DB_NAME: ci
        run: python scripts/probe_p5_concurrency_mysql.py --learners 4 --notes 24 --rounds 2 --answers 8 --signups 6 --creates 8

      - name: Run NOTE overlay and pristine materialization contract on MySQL
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: ci-root-password
          DB_NAME: ci
        run: python scripts/probe_p5_direct_replay_mysql.py --overlay-only

      - name: Qualify complete retirement chain on a generated MySQL schema
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: ci-root-password
          DB_NAME: ci
        run: python scripts/probe_retirement_fresh_chain_mysql.py --output output/retirement-fresh-mysql-ci.json

      - name: Qualify Field identity expansion and exact forecast buckets on MySQL
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: ci-root-password
          DB_NAME: ci
        run: |
          python scripts/probe_field_identity_mysql.py --output output/field-identity-mysql-ci.json
          python scripts/probe_field_identity_cutover_mysql.py --output output/field-identity-cutover-mysql-ci.json
          python scripts/probe_field_value_consumers_mysql.py --output output/field-value-consumers-mysql-ci.json
          python scripts/probe_forecast_snapshots_mysql.py --output output/forecast-snapshots-mysql-ci.json
          python scripts/probe_review_analytics_outbox_mysql.py --output output/review-outbox-mysql-ci.json

      - name: Verify retirement archives and contract guards with focused tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: ci-root-password
          DB_NAME: ci
        run: python scripts/run_tests.py --file tests/test_frozen_template_modernization.py tests/test_retirement_fresh_migration_chain.py tests/test_derived_card_retirement_migration.py tests/test_legacy_model_retirement.py tests/test_card_progress_retirement_migration.py tests/test_template_origin_retirement_migration.py --backend-only

      - name: Run Phase 7 session retention contract on MySQL
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: ci-root-password
          DB_NAME: ci
        run: python scripts/probe_p7_session_retention_mysql.py


      - name: Run migration 48 Connect authority fence probe on MySQL
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: ci-root-password
          DB_NAME: ci
        run: python scripts/probe_p9_connect_fence_mysql.py --refs 2000



  deploy:
    needs: [changes, frontend, backend, spa-contract, redis-contract, mysql-contract]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.changes.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
