name: CI

env:
  # Pin the complete event range. HEAD~1 misses files when a push contains
  # multiple commits; the modular runner consumes these values directly.
  TEST_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  TEST_DIFF_HEAD: ${{ github.sha }}

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.vscode/**'
      - 'flama-audio/**'
  pull_request:
    branches:
      - master
      - develop
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.vscode/**'
      - 'flama-audio/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      frontend: ${{ steps.plan.outputs.frontend }}
      spa_contract: ${{ steps.plan.outputs.spa_contract }}
      redis_contract: ${{ steps.plan.outputs.redis_contract }}
      mysql_contract: ${{ steps.plan.outputs.mysql_contract }}
      deploy: ${{ steps.plan.outputs.deploy }}
      frontend_deploy: ${{ steps.plan.outputs.frontend_deploy }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan affected validation jobs
        id: plan
        env:
          CI_FORCE_ALL_VALIDATION: ${{ github.event_name != 'pull_request' }}
        run: python scripts/run_tests.py --ci-plan --github-output "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python for changed-file selection
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # jsdom 30 (used by Vitest) requires Node >= 22.22.2. Pin the
          # compatible patch instead of relying on the runner's cached 22.x.
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: |
          if [ "${{ github.ref_name }}" = "master" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Running full frontend test suite on master..."
            npm test
          else
            echo "Running targeted tests for changed files..."
            python ../scripts/run_tests.py --changed --frontend-only
          fi

      - name: Build
        run: npm run build:ci

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        env:
          DB_USER: ci
          DB_NAME: ci
          SECRET_KEY: ci-secret
        run: |
          if [ "${{ github.ref_name }}" = "master" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Running full backend test suite on master..."
            python scripts/run_tests.py --all --backend-only
          else
            echo "Running modular backend test suite for changed modules..."
            python scripts/run_tests.py --changed --backend-only
          fi

  spa-contract:
    needs: [changes, frontend]
    if: >-
      needs.changes.outputs.spa_contract == 'true' &&
      needs.frontend.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build the SPA in this job instead of passing an artifact: CI uses no
      # Actions artifact storage, so an exhausted quota cannot block it.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build:ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Flask serves the real Vite artifact
        env:
          DB_USER: ci
          DB_NAME: ci
          SECRET_KEY: ci-secret
          FLAMA_REQUIRE_REAL_SPA_ARTIFACT: '1'
        run: python -m unittest tests.test_spa_artifact_contract

  redis-contract:
    needs: changes
    if: needs.changes.outputs.redis_contract == 'true'
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Redis contract tests
        env:
          DB_USER: ci
          DB_NAME: ci
          SECRET_KEY: ci-secret
          REDIS_URL: redis://127.0.0.1:6379/15
        run: python -m unittest tests.test_shared_state_services

  mysql-contract:
    needs: changes
    if: needs.changes.outputs.mysql_contract == 'true'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ci
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify Alembic migrations on MySQL
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: ci-root-password
          DB_NAME: ci
          SECRET_KEY: ci-secret
          STARTUP_RUN_MAINTENANCE: '1'
          STARTUP_RUN_DB_CREATE_ALL: '1'
        run: flask --app wsgi.py db upgrade

      - name: Run MySQL locking and concurrency contract
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASSWORD: ci-root-password
          DB_NAME: ci
        run: python scripts/probe_p1_02_mysql_concurrency.py

  deploy:
    needs: [changes, frontend, backend, spa-contract, redis-contract, mysql-contract]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.changes.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  # Backend first, SPA second: a SPA published ahead of its backend calls
  # endpoints that do not exist yet. `!cancelled()` lets a frontend-only push
  # continue past the skipped backend deploy; a failed one blocks the SPA.
  deploy-frontend:
    needs: [changes, frontend, backend, spa-contract, redis-contract, mysql-contract, deploy]
    if: >-
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.changes.outputs.frontend_deploy == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      needs.frontend.result == 'success' &&
      (needs.deploy.result == 'success' || needs.changes.outputs.deploy != 'true')
    uses: ./.github/workflows/deploy-frontend.yml
    secrets: inherit
