name: Build & Deploy Flama Audio

on:
  push:
    branches:
      - master
    paths:
      - "flama-audio/**"
      - ".github/workflows/flama-audio-release.yml"
  workflow_dispatch:

concurrency:
  group: flama-audio-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: windows-latest
    environment: Flama

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore Dependencies
        run: dotnet restore flama-audio/Flama.Audio.sln

      - name: Run Tests
        run: dotnet test flama-audio/Flama.Audio.sln -c Release --no-restore

      - name: Clean Publish Directory
        run: |
          if (Test-Path flama-audio/publish) { Remove-Item -Recurse -Force flama-audio/publish }

      - name: Publish Single-File Executable
        run: |
          dotnet publish flama-audio/src/Flama.Audio.App/Flama.Audio.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o flama-audio/publish/singlefile

      - name: Prepare Portable Release
        run: |
          $sourcePath = "flama-audio/publish/singlefile/Flama.Audio.App.exe"
          $releaseDirectory = "flama-audio/publish/release"
          $releasePath = Join-Path $releaseDirectory "FlamaAudio-Portable.exe"

          if (-not (Test-Path -LiteralPath $sourcePath -PathType Leaf)) {
            throw "Published executable was not found at $sourcePath"
          }

          New-Item -ItemType Directory -Force -Path $releaseDirectory | Out-Null
          Copy-Item -LiteralPath $sourcePath -Destination $releasePath -Force

          $releaseFiles = @(Get-ChildItem -LiteralPath $releaseDirectory -File)
          if ($releaseFiles.Count -ne 1 -or $releaseFiles[0].Name -ne "FlamaAudio-Portable.exe") {
            throw "Release directory must contain exactly FlamaAudio-Portable.exe"
          }

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flama-audio-win-x64
          path: flama-audio/publish/release/FlamaAudio-Portable.exe
          if-no-files-found: error
          retention-days: 7

      - name: Deploy Portable EXE to Hostinger VPS
        if: github.ref == 'refs/heads/master'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_TMP_PATH: /tmp/FlamaAudio-Portable-${{ github.run_id }}-${{ github.run_attempt }}.exe
        run: |
          $requiredSecrets = @{
            SSH_HOST = $env:SSH_HOST
            SSH_PORT = $env:SSH_PORT
            SSH_USER = $env:SSH_USER
            SSH_PRIVATE_KEY = $env:SSH_PRIVATE_KEY
          }
          $missingSecrets = @(
            $requiredSecrets.GetEnumerator() |
              Where-Object { [string]::IsNullOrWhiteSpace([string]$_.Value) } |
              ForEach-Object { $_.Key }
          )
          if ($missingSecrets.Count -gt 0) {
            throw "Missing required Flama environment secrets: $($missingSecrets -join ', ')"
          }

          $sshDirectory = Join-Path $env:USERPROFILE ".ssh"
          New-Item -ItemType Directory -Force -Path $sshDirectory | Out-Null
          $keyFile = Join-Path $sshDirectory "flama_audio_deploy_key"
          $privateKey = $env:SSH_PRIVATE_KEY -replace "`r", ""
          if (-not $privateKey.EndsWith("`n")) { $privateKey += "`n" }
          [System.IO.File]::WriteAllText($keyFile, $privateKey)

          try {
            scp -P $env:SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i $keyFile `
              flama-audio/publish/release/FlamaAudio-Portable.exe `
              "${env:SSH_USER}@${env:SSH_HOST}:$env:REMOTE_TMP_PATH"
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload FlamaAudio-Portable.exe" }

            $remoteCommand = "set -e; install -d -m 755 -o flama -g flama /var/lib/flama/downloads; install -m 644 -o flama -g flama '$env:REMOTE_TMP_PATH' /var/lib/flama/downloads/FlamaAudio-Portable.exe.new; mv -f /var/lib/flama/downloads/FlamaAudio-Portable.exe.new /var/lib/flama/downloads/FlamaAudio-Portable.exe; rm -f '$env:REMOTE_TMP_PATH'"
            ssh -p $env:SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i $keyFile `
              "${env:SSH_USER}@${env:SSH_HOST}" $remoteCommand
            if ($LASTEXITCODE -ne 0) { throw "Failed to activate FlamaAudio-Portable.exe on the server" }
          }
          finally {
            Remove-Item -LiteralPath $keyFile -Force -ErrorAction SilentlyContinue
          }
